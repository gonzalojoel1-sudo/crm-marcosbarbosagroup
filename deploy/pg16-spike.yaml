# Spike Postgres 16 — efímero, se levanta y baja con el spike.
# Driver: bridge para que el backend efímero (compose separado) acceda por IP.
# NO toca ninguna red de Dokploy.

services:
  pg-spike:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: spike-only-change-me
      POSTGRES_USER: postgres
    ports:
      - "55433:5432"
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  pgnet:
    driver: bridge
    name: crm-pg-spike-net
