<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#100f0d">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Grilla de agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Tokens reales del CRM (copiados de apps/web/src/styles.css) ───────── */
:root {
  --bg: #100f0d;
  --surface: #171614;
  --surface-2: #1d1b18;
  --border: rgba(255, 255, 255, 0.08);
  --border-2: rgba(255, 255, 255, 0.15);
  --fg: #f4f1ea;
  --fg-dim: #8e8c94;
  --fg-faint: #5c5a62;
  --accent: #fe4100;
  --accent-2: #ff5c1f;
  --accent-soft: rgba(254, 65, 0, 0.12);
  --accent-line: rgba(254, 65, 0, 0.26);
  --danger: oklch(0.66 0.155 28);
  --ok: #0d7c66;
  --r: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --ease: cubic-bezier(.23, 1, .32, 1);
}
html { color-scheme: dark; }
* { box-sizing: border-box; }
html,

body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.45 Outfit, system-ui, sans-serif;
  --display: Fraunces, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(254, 65, 0, .22); color: #fff; }
input, textarea { caret-color: var(--accent); }
a { text-underline-offset: 2px; text-decoration-thickness: 1px; }
:root { --focus: #fe4100; }        /* 5.45:1 sobre el fondo: cumple 1.4.11 */
*:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
  box-shadow: 0 0 0 4px rgba(0, 0, 0, .85);   /* dos colores (C40): se ve sobre cualquier superficie */
}
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.rangetitle, .grid-empty .ge-t { text-wrap: balance; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 999px; border: 3px solid var(--bg); }

/* el picker es chrome: le reservo su franja. La app ocupa el alto exacto, sin scroll de pagina. */
#stage { height: 100vh; box-sizing: border-box; padding-top: 62px; }

/* ── Shell común a las tres variantes ─────────────────────────────────── */
.shell { display: grid; grid-template-columns: 212px 1fr 208px; gap: 14px; padding: 14px 18px 16px; height: 100%; box-sizing: border-box; min-height: 0; }
/* por debajo de 1560px el panel lateral se pliega: el ancho va a las columnas de dias */
.shell[data-mini="off"] { grid-template-columns: 200px 1fr; }
.shell[data-mini="off"] .mini { display: none; }
.shell > main { display: flex; flex-direction: column; min-height: 0; }
.side, .mini { display: flex; flex-direction: column; gap: 18px; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.side, .mini { background: var(--surface); border-radius: 14px; padding: 14px; }
/* por debajo de 1560px el panel lateral se pliega: el ancho va a las columnas de dias */
@media (max-width: 1559px) { .shell { grid-template-columns: 200px 1fr; } .shell .mini { display: none; } }
.block-title {
  font-size: 12.5px; font-weight: 600; letter-spacing: -.005em;
  color: var(--fg); margin: 0 0 8px;
}
.cal {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px;
  width: 100%; border-radius: 8px; cursor: pointer;
  background: none; border: 0; font: inherit; color: inherit; text-align: left;
  transition: background 140ms ease-out;
}
.cal:hover { background: var(--surface); }
.cal .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.cal .name { font-size: 13px; color: var(--fg); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .count { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.cal[data-off] .name, .cal[data-off] .count { color: var(--fg-faint); }
.cal[data-off] .dot { opacity: .3; }
.chev { margin-left: auto; color: var(--fg-faint); }

.topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: nowrap; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
.skip {
  position: fixed; top: 8px; left: 8px; z-index: 100;
  transform: translateY(-200%); background: var(--accent); color: var(--bg);
  font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px;
}
.skip:focus { transform: none; }

.rangetitle { margin: 0; font-family: var(--display); font-optical-sizing: auto; font-size: 23px; font-weight: 400; letter-spacing: -.015em; white-space: nowrap; flex: none; }
.rangecount { font-size: 12.5px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-variant-numeric: tabular-nums; }
.topbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--fg);
  font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
  transition: border-color 140ms ease-out, background 140ms ease-out;
}
.btn:hover { border-color: var(--border-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); }
.seg { display: inline-flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { background: none; border: 0; color: var(--fg-dim); font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px; cursor: pointer; min-height: 24px; }
.seg button.on { background: var(--surface-2); color: var(--fg); }

.gridwrap {
  position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
}
.heads {
  display: grid; gap: 0; position: sticky; top: 0; z-index: 4;
  background: var(--bg); border-bottom: 1px solid var(--border);
  transition: box-shadow 160ms ease-out;
}
/* la sombra aparece solo cuando hay algo scrolleado debajo */
.gridwrap[data-scrolled] .heads { box-shadow: 0 10px 14px -12px rgba(0,0,0,.85); }
.days { display: grid; position: relative; flex: 1; min-height: 0; }
.col.today-col { background: rgba(244,241,234,.022); }
.gutter { position: relative; position: sticky; left: 0; z-index: 3; background: var(--bg); }
.hourlab {
  font-family: var(--mono); font-size: 11px; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  position: absolute; right: 8px; font-size: 11px; color: var(--fg-faint);
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.col { position: relative; }
.colhead { display: flex; align-items: baseline; justify-content: center; gap: 5px; }
.colhead .dow { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); }
.colhead .dom { font-size: 18px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.colhead.today .dom { color: var(--accent-2); }
.hourline { position: absolute; left: 0; right: 0; pointer-events: none; }

.nowline { position: absolute; left: 0; right: 0; z-index: 5; pointer-events: none; }
.nowline .bar { height: 1.5px; background: var(--accent); }
.nowline .knob { position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }

.ev {
  position: absolute; overflow: visible; cursor: grab; text-align: left; font: inherit; color: var(--fg);
  border: 0; appearance: none;
  /* ancho = 1/carriles del grupo de solapamiento */
  left: calc(var(--lane, 0) * (100% / var(--lanes, 1)) + 4px);
  width: calc(100% / var(--lanes, 1) - 8px);
}
.ev:active { cursor: grabbing; }
.ev .t { font-weight: 600; }
.ev .m { font-size: 11.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
/* El asa de redimensionar mide 24 px de alto y está centrada en el borde inferior:
   12 px dentro del bloque y 12 fuera. Lo que crece es el ÁREA de puntero, no el glifo (SC 2.5.8). */
.ev .grip { position: absolute; left: 0; right: 0; bottom: -12px; height: 24px; cursor: ns-resize; }
.ev[data-busy] { cursor: default; }
.ev .sync { width: 7px; height: 7px; border-radius: 999px; display: inline-block; margin-left: 5px; }
.sync.ok { background: var(--ok); }
.sync.pend { background: oklch(0.76 0.115 72); }
.sync.fail { background: var(--danger); }

.droplab {
  position: fixed; z-index: 40; transform: translate(-50%, -124%);
  background: #1f1d19; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-radius: 10px; padding: 5px 10px; font-size: 12px; font-variant-numeric: tabular-nums;
  font-family: var(--mono); letter-spacing: -.01em;
  box-shadow: 0 8px 20px rgba(0,0,0,.45);
  pointer-events: none; white-space: nowrap;
}
.droplab b { font-weight: 600; }
.droplab em { font-style: normal; color: var(--danger); }

.mini .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini .mgrid span { font-family: var(--mono); font-size: 11px; text-align: center; color: var(--fg-dim); padding: 3px 0; border-radius: 8px; font-variant-numeric: tabular-nums; }
.mini .mgrid span.h { color: var(--fg-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.mini .mgrid span.inrange { background: var(--surface); color: var(--fg); }
.mini .mgrid span.today { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.mini .mgrid span.has-ev::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 999px; background: var(--fg-faint); margin: 2px auto 0; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--fg-dim); }
.legend div { display: flex; align-items: center; gap: 7px; }
.legend i { width: 16px; height: 9px; border-radius: 3px; display: block; }

/* ═══════════════════════════════════════════════════════════════════════
   EL EJE QUE CAMBIA ENTRE LAS TRES ES CÓMO SE OCUPA EL VACÍO
   Franja  = hundir las horas fuera de horario (BusyCal "shade the times")
   Pliegue = colapsar las franjas vacías en una fila etiquetada (Google Labs)
   Zoom    = control de densidad del alto de hora (Notion Calendar)
   En las tres, el rango horario del evento está SIEMPRE visible.
   ═══════════════════════════════════════════════════════════════════════ */

.ev {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--c);
  border-radius: 12px; padding: 7px 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 2px 6px rgba(0,0,0,.38);
  transition: box-shadow 150ms ease-out, filter 150ms ease-out;
}
.ev:hover { filter: brightness(1.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 5px 14px rgba(0,0,0,.45); }
.ev .t { order: 1; font-weight: 500; font-size: 13px; line-height: 1.2; color: #fff; }
/* el secundario se tine desde el propio bloque, nunca gris */
.ev .m {
  order: 2; font-family: var(--mono); font-size: 11px; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; color: #fff; font-weight: 400;
}
/* bajo: no se pierde el rango horario, se pone delante */
.ev .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* en bloque bajo el titulo necesita el ancho: se muestra solo la hora de inicio */
.ev[data-compact] { flex-direction: row; align-items: baseline; gap: 7px; padding: 5px 9px; border-radius: 9px; }
.ev[data-compact] .m { order: 1; flex: none; }
.ev[data-compact] .to { display: none; }
.ev[data-compact] .t { order: 2; flex: 1; min-width: 0; -webkit-line-clamp: 1; font-size: 12.5px; white-space: nowrap; }
/* mínimo: a esta altura solo entra una cosa, y esa cosa es el TITULO
   (la hora ya la dicen la posición en la grilla, el gutter y el tooltip) */
.ev[data-tiny] { flex-direction: row; align-items: center; padding: 3px 9px; }
.ev[data-tiny] .m { display: none; }
.ev[data-tiny] .t { display: -webkit-box; -webkit-line-clamp: 1; font-size: 12px; }
/* comparte columna con otro evento: el titulo se queda con todo el ancho disponible */
.ev[data-narrow] { padding: 6px 8px; }
.ev[data-narrow] .m { display: none; }
.ev[data-narrow] .t { display: -webkit-box; -webkit-line-clamp: 2; font-size: 12.5px; }
.ev[data-busy] { background: #211f1b; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.3); }
.ev[data-busy] .t, .ev[data-busy] .m {
  font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
  text-transform: uppercase; color: rgba(244,241,234,.55);
}

/* Franja: la banda fuera de horario se hunde, no desaparece */
.bandshade { position: absolute; left: 0; right: 0; background: rgba(0,0,0,.3); pointer-events: none; z-index: 1; }
.bandlab {
  position: absolute; left: 0; right: 0; text-align: center; transform: translateY(-50%);
  font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--fg-faint); pointer-events: none; z-index: 2;
}

/* Pliegue: la franja vacía se pliega a una fila fina, etiquetada y reversible */
.bandfold {
  position: absolute; left: 0; right: 0; display: flex; align-items: center;
  justify-content: center; gap: 7px; cursor: pointer; font: inherit;
  font-family: var(--mono); font-size: 11px; letter-spacing: .03em; color: var(--fg-dim);
  background: rgba(244,241,234,.022); border: 0;
  border-top: 1px solid rgba(244,241,234,.05);
  border-bottom: 1px solid rgba(244,241,234,.05); z-index: 3;
}
.bandfold:hover { background: rgba(244,241,234,.055); color: var(--fg-dim); }
.bandfold b { font-weight: 500; color: var(--fg-dim); }

[data-variant="franja"] .heads, [data-variant="franja"] .days,
[data-variant="pliegue"] .heads, [data-variant="pliegue"] .days,
[data-variant="zoom"] .heads, [data-variant="zoom"] .days { grid-template-columns: 52px repeat(5, 1fr); }
[data-variant="franja"] .colhead, [data-variant="pliegue"] .colhead, [data-variant="zoom"] .colhead { padding: 11px 0; }
[data-variant="franja"] .hourline, [data-variant="pliegue"] .hourline, [data-variant="zoom"] .hourline { border-top: 1px solid rgba(244,241,234,.12); }
[data-variant="franja"] .hourline.half, [data-variant="pliegue"] .hourline.half, [data-variant="zoom"] .hourline.half { border-top: 0; }
[data-variant="franja"] .col, [data-variant="pliegue"] .col, [data-variant="zoom"] .col { border-right: 1px solid rgba(255,255,255,.09); }
[data-variant="franja"] .col:last-child, [data-variant="pliegue"] .col:last-child, [data-variant="zoom"] .col:last-child { border-right: 0; }
[data-variant="franja"] .slot:hover, [data-variant="pliegue"] .slot:hover, [data-variant="zoom"] .slot:hover { background: rgba(255,255,255,.018); }

/* Zoom: el control de densidad */
.zoomctl { display: flex; gap: 2px; background: var(--surface-2); border-radius: 8px; padding: 2px; }
.zoomctl button {
  background: none; border: 0; color: var(--fg-dim); font: inherit; font-size: 11px;
  padding: 3px 7px; border-radius: 6px; cursor: pointer; white-space: nowrap; min-height: 24px;
}
.zoomctl button.on { background: var(--surface); color: var(--fg); }
.meswrap { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.mes { width: 100%; border-collapse: collapse; table-layout: fixed; }
.mes thead th {
  text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint);
  padding: 0 8px 8px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 2;
}
.mcell { vertical-align: top; height: 104px; padding: 7px 8px; border-top: 1px solid var(--border); border-right: 1px solid rgba(255,255,255,.05); }
.mcell:last-child { border-right: 0; }
.mcell.hoy { background: rgba(254,65,0,.055); box-shadow: inset 0 2px 0 var(--accent); }
.mnum { display: block; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg-dim); margin-bottom: 5px; }
.mcell.hoy .mnum { color: var(--accent-2); }
.mev {
  display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
  background: var(--surface); border: 0; border-radius: 5px;
  padding: 3px 7px; margin-bottom: 3px; min-height: 24px;
  font: inherit; color: var(--fg); cursor: pointer; overflow: hidden;
  transition: background 140ms ease-out;
}
.mev:hover { background: var(--surface-2); }
.mev-d { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.mev-h { font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim); flex: none; }
.mev-t { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mev.busy { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.mmas { background: none; border: 0; padding: 1px 6px; font: inherit; font-size: 11.5px; color: var(--fg-dim); cursor: pointer; text-align: left; width: 100%; border-radius: 5px; min-height: 24px; }
.mmas:hover { background: var(--surface); color: var(--fg); }

.lista { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; }
.ldia { display: grid; grid-template-columns: 168px 1fr; gap: 20px; padding: 16px 0; border-top: 1px solid var(--border); }
.ldia:first-child { border-top: 0; padding-top: 4px; }
.ldia-h { margin: 0; position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.ldia-n { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.ldia-c { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }
.ldia[data-today] .ldia-n { color: var(--accent-2); }
.ldia-cuerpo { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; min-width: 0; }
.ldia-nueva { min-height: 24px; }   /* objetivo de puntero >= 24x24 */
.levs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.lev {
  display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 0; border-radius: 10px; padding: 9px 12px;
  font: inherit; color: inherit; cursor: pointer; transition: background 140ms ease-out;
}
.lev:hover { background: var(--surface-2); }
.lev-h { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--fg-dim); flex: none; width: 122px; }
.lev-t { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lev-c { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--fg-dim); flex: none; }
.lev-c i { width: 8px; height: 8px; border-radius: 3px; display: block; }
.lev.busy { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
/* verde legible: --ok sobre --surface da 3.5:1; este tono da 5.2:1 (texto normal) */
.lev-p { font-family: var(--mono); font-size: 11px; color: #1f9a7e; flex: none; }
.lvy { margin: 0; font-size: 13px; color: var(--fg-faint); }

.grid-empty {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; text-align: center; z-index: 5;
}
.grid-empty .ge-t { font-size: 14px; font-weight: 500; color: var(--fg); margin: 0; }
.grid-empty .ge-s { font-size: 12.5px; color: var(--fg-dim); margin: 0 0 8px; max-width: 46ch; }

.bandover { position: absolute; left: 52px; right: 0; top: 0; bottom: 0; pointer-events: none; z-index: 4; }
.bandover .bandfold { pointer-events: auto; }

.slot { position: absolute; left: 0; right: 0; cursor: crosshair; }

/* ── Panel de reunión: 3ª columna del shell (no flota sobre los días) ────
   Cuando está abierto reemplaza al panel del mes para no romper la grilla. */
#panel {
  grid-column: 3; align-self: start; background: var(--surface);
  border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px;
}
.shell[data-panel="on"] { grid-template-columns: 200px 1fr 320px; }
.shell[data-panel="on"] .mini { display: none; }   /* el panel ocupa el lugar del mes */
#panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
#panel label { font-size: 12px; color: var(--fg-dim); }
#panel input { background: var(--surface-2); border: 0; border-radius: 8px; padding: 8px 10px; font: inherit; color: var(--fg); width: 100%; }
#panel .p-hint { margin: -4px 0 0; font-size: 11px; color: var(--fg-dim); }
#panel fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px; }
#panel .p-dur { background: var(--surface-2); border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; color: var(--fg-dim); cursor: pointer; min-height: 24px; }
#panel .p-dur.on { background: var(--accent); color: var(--bg); }
#panel .p-acciones { display: flex; gap: 6px; margin-top: 6px; }

/* ── "Mover a…": superficie de borrador, no un modo ──────────────────────

/* pasos y destinos de día son <button>: el mismo control sirve al puntero y al teclado */

/* ── "Cambiar duración…": mismo borrador que "Mover a…" ───────────────────
