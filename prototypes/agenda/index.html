<script>
/* ══════════════════════════════════════════════════════════════════════
   Datos realistas: las categorías y las verticales del grupo
   ══════════════════════════════════════════════════════════════════════ */
/* Paleta: un solo croma (0,155) para que sea UNA familia; la luminosidad de cada
   matiz la fija el contraste con texto blanco (>= 4.6:1). Bloques solidos, no tintes. */
const CATS = {
  consultora: { label: "Consultora", color: "oklch(0.576 0.155 45)"  },
  ministerial:{ label: "Ministerial",color: "oklch(0.558 0.155 245)" },
  personal:   { label: "Personal",   color: "oklch(0.54 0.155 155)"  },
  trabajo:    { label: "Trabajo",    color: "oklch(0.574 0.155 285)" },
  software:   { label: "Software",   color: "oklch(0.58 0.155 330)"  },
};
// El mismo tinte que usan los bloques: la leyenda muestra lo que se ve, no el color crudo.
const tint = (c) => c;   // los puntos muestran el color real del bloque
const DAYS = ["Lun 15", "Mar 16", "Mié 17", "Jue 18", "Vie 19"];
const DIAS_LARGOS = ["lunes 15", "martes 16", "miércoles 17", "jueves 18", "viernes 19"];
const START_H = 5, END_H = 21, SLOTS_PER_H = 4;

let EVENTS = [
  { day: 0, min: 8 * 60 + 30, dur: 45,  title: "Reunión de equipo",            cat: "trabajo",     origin: "CRM",     sync: "ok" },
  { day: 0, min: 10 * 60,      dur: 60,  title: "Constructora Del Sur S.A.",  cat: "consultora",  origin: "CRM",     sync: "ok",   sub: "Diagnóstico 360°" },
  { day: 0, min: 14 * 60 + 15, dur: 45,  title: "Revisión de propuesta",      cat: "software",    origin: "CRM",     sync: "pend", sub: "Cabral, Franco" },
  { day: 0, min: 16 * 60,      dur: 90,  title: "Ocupado",                    cat: null,          origin: "Google",  sync: null,   busy: true },
  { day: 1, min: 9 * 60,       dur: 30,  title: "Llamada: Oscar Vera",        cat: "consultora",  origin: "Reserva", sync: "ok",   sub: "Reservó por la web" },
  { day: 1, min: 11 * 60 + 30, dur: 60,  title: "Ministerial · Cuerpo de Cristo", cat: "ministerial", origin: "CRM", sync: "ok" },
  { day: 1, min: 15 * 60,      dur: 120, title: "Block: trabajo profundo",    cat: "personal",    origin: "CRM",     sync: "ok" },
  { day: 2, min: 8 * 60,       dur: 60,  title: "Cuerpo de Cristo",           cat: "ministerial", origin: "Google",  sync: null,   busy: true },
  { day: 2, min: 12 * 60 + 30, dur: 45,  title: "Almuerzo con Marcos",        cat: "personal",    origin: "Google",  sync: null,   busy: true },
  { day: 2, min: 17 * 60,      dur: 60,  title: "Jonatan · Plan 3",           cat: "consultora",  origin: "Reserva", sync: "fail", sub: "Reintentando sincronizar" },
  { day: 3, min: 10 * 60,      dur: 30,  title: "Seguimiento semanal",        cat: "trabajo",     origin: "CRM",     sync: "ok" },
  { day: 3, min: 13 * 60 + 15, dur: 90,  title: "Taller: Software y Apps",    cat: "software",    origin: "CRM",     sync: "ok" },
  { day: 1, min: 9 * 60,       dur: 60,  title: "Reunión de socios",          cat: "consultora", origin: "CRM",     sync: "ok" },
  { day: 1, min: 9 * 60 + 15,  dur: 45,  title: "Llamada: Estudio Norte",     cat: "ministerial",origin: "Reserva", sync: "ok" },
  { day: 4, min: 9 * 60 + 30,  dur: 45,  title: "Fernando Bustos · Plan 1",   cat: "consultora",  origin: "Reserva", sync: "ok" },
  { day: 4, min: 12 * 60,      dur: 60,  title: "Ministerio · Los 1000 Socios",cat: "ministerial",origin: "CRM",     sync: "ok" },
  { day: 4, min: 16 * 60 + 30, dur: 60,  title: "Legendarios · próximas fechas", cat: "ministerial", origin: "Google", sync: null, busy: true },
];

const fmt = (min) => String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
const snap = (min) => Math.round(min / 15) * 15;
const cat = (k) => CATS[k] || { label: "", color: "#6b7280" };

/* Anuncios: el nodo vive fuera del subarbol que se reemplaza, y se limpia
   antes de escribir para que un mensaje identico repetido se vuelva a leer. */
function announce(texto) {
  const a = document.getElementById("announcer");
  if (!a) return;
  a.textContent = "";
  requestAnimationFrame(() => { a.textContent = texto; });
}

/* SC 2.1.4: los atajos de UNA tecla del producto valen solo con el foco dentro de
   un componente del producto (la grilla, su contenedor con scroll, el menú o la
   barra de acciones/vistas). Sin ningún control enfocado (body) NO valen: "sin
   foco" no es foco de componente. Con el foco en un campo u otro control, la tecla
   es texto. El chrome del prototipo (1/2/3, r) queda global a propósito: no es UI
   del producto. */
const EN_GRILLA = () => {
  const a = document.activeElement;
  if (!a || a === document.body || a === document.documentElement) return false;
  return !!a.closest("#grilla, .gridwrap, #menu, .hoy-btn, [data-view], [data-nueva]");
};

/* ══════════════════════════════════════════════════════════════════════
   Grilla + interacción (idéntica en las tres; cambia la presentación)
   ══════════════════════════════════════════════════════════════════════ */
const HOUR_H = { franja: 44, pliegue: 50, zoom: 44 };
const ZOOM_STEPS = [ { m: 0.72, label: "Compacto" }, { m: 1, label: "Cómodo" }, { m: 1.32, label: "Amplio" } ];
let ZOOM_MULT = 1.32;   // Amplio: la densidad elegida
let PENDING_SCROLL = null;
let FIRST_PAINT = true;   // la primera pintura abre en la hora actual
const VIEWS = ["semana", "lista", "mes"];
let VIEW = VIEWS.includes(new URLSearchParams(location.search).get("view"))
  ? new URLSearchParams(location.search).get("view") : "semana";
// El mes cuadra con la semana: el 15 es lunes, asi que el 1 tambien. Se muestran
// solo los dias de semana (Lun a Vie), igual que la grilla: la semana de 15-19 es una fila.
const MES = { dias: 30, hoy: 16, cols: ["lunes", "martes", "miércoles", "jueves", "viernes"] };
const semanasDelMes = () => {
  const filas = [];
  for (let d = 1; d <= MES.dias; d++) {
    const wd = (d - 1) % 7;
    if (wd > 4) continue;                       // fin de semana: no se muestra
    const w = Math.floor((d - 1) / 7);
    (filas[w] = filas[w] || []).push(d);
  }
  return filas;
};
let OPEN = new Set();
let HIDDEN = new Set();          // agendas (categorias) apagadas
let HIDDEN_ORIGIN = new Set();   // origenes apagados (cubre los importados sin categoria)
// Un evento se oculta por su agenda; si no tiene agenda (importado), por su origen.
const oculto = (e) => (e.cat ? HIDDEN.has(e.cat) : HIDDEN_ORIGIN.has(e.origin));
let VARIANT = "franja";

const WORK_FROM = 9 * 60, WORK_TO = 18 * 60;   // horario del grupo (theme.ts)
const NOW_MIN = 15 * 60 + 42;                  // "ahora" del prototipo: un solo lugar

function bandsFrom() {
  const busy = EVENTS.filter((e) => !e.busy);
  if (!busy.length) return [];
  const sorted = busy.slice().sort((a, b) => a.min - b.min);
  const first = Math.floor(sorted[0].min / 30) * 30;
  const last = Math.ceil(Math.max(...sorted.map((e) => e.min + e.dur)) / 30) * 30;
  const from = Math.max(START_H * 60, first);
  const to = Math.min(END_H * 60, last);
  const out = [];
  if (from - START_H * 60 > 30) out.push({ from: START_H * 60, to: from });
  if (END_H * 60 - to > 30) out.push({ from: to, to: END_H * 60 });
  return out;
}

const FOLD_H = 30;   // alto de una franja plegada
let LAST_FIT = 0;    // alto de hora calculado para entrar en pantalla

// El alto de hora se DERIVA del alto real disponible, no de una constante.
function fitHourHeight() {
  const wrap = document.querySelector(".gridwrap");
  const heads = document.querySelector(".heads");
  if (!wrap || !wrap.clientHeight) return 44;
  const avail = wrap.clientHeight - (heads ? heads.getBoundingClientRect().height : 0) - 2;
  const bands = VARIANT === "pliegue" ? bandsFrom() : [];
  let foldPx = 0, foldHours = 0;
  for (const b of bands) {
    if (!OPEN.has(`${b.from}-${b.to}`)) { foldPx += FOLD_H; foldHours += (b.to - b.from) / 60; }
  }
  const freeHours = (END_H - START_H) - foldHours;
  if (avail < 80 || freeHours <= 0) return 44;
  return Math.max(22, (avail - foldPx) / freeHours);
}

// minuto que esta en el centro del area visible (para conservar el ancla al cambiar densidad)
function centerTime() {
  const wrap = document.querySelector(".gridwrap");
  if (!wrap) return null;
  const g = geom();
  const midY = wrap.scrollTop + wrap.clientHeight / 2;
  let lo = START_H * 60, hi = END_H * 60;
  for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (g.yOf(m) < midY) lo = m; else hi = m; }
  return Math.round((lo + hi) / 2);
}
function scrollToTime(min, smooth) {
  const wrap = document.querySelector(".gridwrap");
  if (!wrap || min == null) return;
  const top = geom().yOf(min) - wrap.clientHeight / 2;
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (smooth && !quieto) wrap.scrollTo({ top, behavior: "smooth" });
  else wrap.scrollTop = top;
}
function jumpToNow() {
  if (VIEW === "lista") {
    const hoy = document.querySelector(".ldia[data-today]");
    const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (hoy) hoy.scrollIntoView({ block: "start", behavior: quieto ? "auto" : "smooth" });
    return;
  }
  scrollToTime(NOW_MIN, true);
}

// Teclado: la grilla scrollea sin mouse (el modelo Amplio vive de scrollear)
function scrollKeys(ev) {
  const wrap = document.querySelector(".gridwrap");
  if (!wrap || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const g = geom();
  const hora = g.hourH;
  const paso = { ArrowDown: hora / 2, ArrowUp: -hora / 2, PageDown: wrap.clientHeight * 0.9, PageUp: -wrap.clientHeight * 0.9 };
  if (ev.key in paso) { wrap.scrollTop += paso[ev.key]; ev.preventDefault(); }
  else if (ev.key === "Home") { wrap.scrollTop = 0; ev.preventDefault(); }
  else if (ev.key === "End") { wrap.scrollTop = wrap.scrollHeight; ev.preventDefault(); }
  else if (ev.key === "h" || ev.key === "H") { jumpToNow(); ev.preventDefault(); }
}

function geom() {
  const fit = LAST_FIT || fitHourHeight();
  const hourH = VARIANT === "zoom" ? fit * ZOOM_MULT : fit;
  const bands = VARIANT === "pliegue" ? bandsFrom() : [];
  const segs = [];
  let cursor = START_H * 60;
  for (const b of bands) {
    if (b.from > cursor) segs.push({ from: cursor, to: b.from, h: ((b.from - cursor) / 60) * hourH });
    const key = `${b.from}-${b.to}`;
    segs.push({ from: b.from, to: b.to, collapsed: !OPEN.has(key), key,
                h: OPEN.has(key) ? ((b.to - b.from) / 60) * hourH : FOLD_H });
    cursor = b.to;
  }
  if (END_H * 60 > cursor) segs.push({ from: cursor, to: END_H * 60, h: ((END_H * 60 - cursor) / 60) * hourH });
  const gridH = segs.reduce((a, s) => a + s.h, 0);
  const yOf = (min) => {
    let y = 0;
    for (const s of segs) {
      if (min < s.from) break;
      if (min >= s.to) { y += s.h; continue; }
      y += ((min - s.from) / (s.to - s.from)) * s.h;
      break;
    }
    return y;
  };
  // inversa de yOf: el click y el arrastre la necesitan (ya se llamaba g.minOf, faltaba acá)
  const minOf = (y) => {
    let acc = 0;
    for (const s of segs) {
      if (y <= acc + s.h) return s.from + ((y - acc) / s.h) * (s.to - s.from);
      acc += s.h;
    }
    return END_H * 60;
  };
  return { hourH, gridH, segs, yOf, minOf };
}

const overlaps = (cand) => EVENTS.some((e) =>
  e.day === cand.day && !e.busy && e !== cand &&
  cand.min < e.min + e.dur && e.min < cand.min + cand.dur);

/* Solapamiento: se agrupan los eventos que se tocan y se reparten en carriles.
   El ancho de cada uno es 1/n del grupo, como Google Calendar y FullCalendar. */
function layoutLanes(evs) {
  const items = evs.slice().sort((a, b) => a.min - b.min || b.dur - a.dur);
  const groups = [];
  let group = [], groupEnd = -1;
  for (const e of items) {
    if (group.length && e.min >= groupEnd) { groups.push(group); group = []; groupEnd = -1; }
    group.push(e);
    groupEnd = Math.max(groupEnd, e.min + e.dur);
  }
  if (group.length) groups.push(group);
  const out = new Map();
  for (const g of groups) {
    const laneEnds = [], assign = new Map();
    for (const e of g) {
      let l = 0;
      while (l < laneEnds.length && laneEnds[l] > e.min) l++;
      laneEnds[l] = e.min + e.dur;
      assign.set(e, l);
    }
    for (const e of g) out.set(e, { lane: assign.get(e), lanes: laneEnds.length });
  }
  return out;
}

function renderEvent(e, g) {
  const c = cat(e.cat);
  const top = g.yOf(e.min), h = Math.max((e.dur / 60) * g.hourH - 2, 22);
  const compact = h < 46, tiny = h < 26;
  const narrow = e.laneCount > 1;
  const sync = (e.sync && e.sync !== "ok")
    ? `<span class="sync ${e.sync}" title="${e.sync === "pend" ? "Sin sincronizar con Google" : "Falló la sincronización"}"></span>`
    : "";
  const range = `${fmt(e.min)} – ${fmt(e.min + e.dur)}${e.origin === "Reserva" ? " · web" : ""}`;
  const lane = e.lane == null ? 1 : e.lane;
  const abierto = MENU && MENU.i === EVENTS.indexOf(e);
  return `<button class="ev" data-i="${EVENTS.indexOf(e)}" ${compact ? "data-compact" : ""} ${tiny ? "data-tiny" : ""} ${h < 24 ? "data-densa" : ""} ${narrow ? "data-narrow" : ""}
    style="top:${top}px;height:${h}px;--c:${c.color};--lane:${e.lane};--lanes:${e.laneCount}" ${e.busy ? "data-busy" : ""}
    ${e.busy ? "" : `aria-haspopup="menu" aria-expanded="${abierto ? "true" : "false"}"`}
    title="${e.title} · ${range}"
    aria-label="${DIAS_LARGOS[e.day]} de septiembre, ${fmt(e.min)} a ${fmt(e.min + e.dur)}, ${e.title}${e.cat ? `, ${cat(e.cat).label}` : ""}${e.busy ? ", ocupado, importado de Google" : ""}${e.sync && e.sync !== "ok" ? ", sin sincronizar" : ""}">
    <span class="k"></span>
    <span class="m">${fmt(e.min)}<span class="to"> – ${fmt(e.min + e.dur)}</span></span>
    <span class="t">${e.title}${sync}</span>
    ${e.busy ? "" : '<span class="grip" title="Estirar para cambiar la duración"></span>'}
  </button>`;
}

function bandOverlay(g) {
  if (VARIANT === "franja") {
    return `<div class="bandover" aria-hidden="true">${[[START_H * 60, WORK_FROM], [WORK_TO, END_H * 60]]
      .filter(([a, b]) => b - a >= 60)
      .map(([a, b]) => `<div class="bandshade" style="top:${g.yOf(a)}px;height:${g.yOf(b) - g.yOf(a)}px"></div>
        <span class="bandlab" style="top:${(g.yOf(a) + g.yOf(b)) / 2}px">fuera de horario</span>`)
      .join("")}</div>`;
  }
  if (VARIANT === "pliegue") {
    return `<div class="bandover" aria-hidden="true">${g.segs.filter((s) => s.collapsed)
      .map((s) => `<button class="bandfold" data-band="${s.key}" style="top:${g.yOf(s.from)}px;height:${s.h}px" title="Mostrar las horas vacías">
        <b>${fmt(s.from)} – ${fmt(s.to)}</b> sin eventos</button>`)
      .join("")}</div>`;
  }
  return "";
}

function renderCol(day, g) {
  const evs = EVENTS.filter((e) => e.day === day && !oculto(e));
  const lanes = layoutLanes(evs);
  for (const e of evs) { const L = lanes.get(e); e.lane = L ? L.lane : 0; e.laneCount = L ? L.lanes : 1; }
  const lines = [];
  for (const s of g.segs) {
    if (s.collapsed) continue;
    const h0 = Math.ceil(s.from / 60), h1 = Math.floor(s.to / 60);
    for (let h = h0; h <= h1; h++) {
      const m = h * 60;
      lines.push(`<div class="hourline" aria-hidden="true" style="top:${g.yOf(m)}px"></div>`);
      if (h < END_H) lines.push(`<div class="hourline half" aria-hidden="true" style="top:${g.yOf(m + 30)}px"></div>`);
    }
  }
  return `<div class="col${day === 1 ? " today-col" : ""}" data-day="${day}" style="height:${g.gridH}px">
    ${lines.join("")}
    <div class="slots"></div>
    ${evs.map((e) => renderEvent(e, g)).join("")}
  </div>`;
}

/* Vista Mes: un mes ES dato tabular, asi que va una TABLA NATIVA
   (semanas como filas, dias de semana como columnas). Nada de role=grid. */
function renderMonth() {
  const filas = semanasDelMes();
  const evsDe = (d) => EVENTS.filter((e) => e.day === d - 15 && !oculto(e)).sort((a, b) => a.min - b.min);
  return `<div class="meswrap" role="region" aria-label="Septiembre de 2026, de lunes a viernes">
    <table class="mes">
      <caption class="sr-only">Septiembre de 2026. Se muestran los días de lunes a viernes.</caption>
      <thead><tr>${MES.cols.map((c) => `<th scope="col">${c}</th>`).join("")}</tr></thead>
      <tbody>${filas.map((semana) => `<tr>
        ${semana.map((d) => {
          const evs = evsDe(d);
          const esHoy = d === MES.hoy;
          return `<td class="mcell${esHoy ? " hoy" : ""}"${esHoy ? ' aria-current="date"' : ""}>
            <span class="mnum">${d}</span>
            ${evs.slice(0, 3).map((e) => `<button class="mev${e.busy ? " busy" : ""}"
              title="${e.title} · ${fmt(e.min)} – ${fmt(e.min + e.dur)}"
              aria-label="${MES.cols[(d - 1) % 7]} ${d} de septiembre, ${fmt(e.min)} a ${fmt(e.min + e.dur)}, ${e.title}${e.cat ? `, ${cat(e.cat).label}` : ""}">
              <span class="mev-d" style="background:${e.cat ? cat(e.cat).color : "var(--fg-faint)"}"></span>
              <span class="mev-h">${fmt(e.min)}</span><span class="mev-t">${e.title}</span></button>`).join("")}
            ${evs.length > 3 ? `<button class="mmas" data-ver-lista>+${evs.length - 3} más</button>` : ""}
          </td>`;
        }).join("")}
        ${Array.from({ length: 5 - semana.length }, () => '<td class="mcell vacia" aria-hidden="true"></td>').join("")}
      </tr>`).join("")}</tbody>
    </table>
  </div>`;
}

/* Vista Lista: la alternativa accesible. Una grilla 2D de tiempo es dificil de
   recorrer con lector de pantalla; una lista de secciones por dia, no. Es un
   compuesto APG: un solo tab stop (roving tabindex), flechas adentro y cada fila
   abre el MISMO menú que un bloque de la grilla. */
function renderList() {
  const filas = DAYS.map((_, i) =>
    EVENTS.filter((e) => e.day === i && !oculto(e)).sort((a, b) => a.min - b.min));
  const plano = filas.flat();
  // La fila tabbable es la que el usuario dejó enfocada; si desapareció (se ocultó
  // su agenda, se borró), recae en la primera fila visible.
  ROVING = ROVING && plano.includes(ROVING) ? ROVING : (plano[0] || null);
  return `<div class="lista" id="grilla" role="region" aria-label="Lista de reuniones de la semana" tabindex="-1">${
    DAYS.map((_, i) => {
      const evs = filas[i];
      const id = `ldia-${i}`;
      return `<section class="ldia" aria-labelledby="${id}"${i === 1 ? ' data-today=""' : ""}>
        <h3 class="ldia-h" id="${id}">
          <span class="ldia-n">${DIAS_LARGOS[i]} de septiembre</span>
          <span class="ldia-c">${evs.length ? `${evs.length} reunión${evs.length > 1 ? "es" : ""}` : "sin reuniones"}</span>
        </h3>
        <div class="ldia-cuerpo">
          <button class="ldia-nueva btn" data-nueva-dia="${i}">Nueva reunión</button>
          ${evs.length
          ? `<ul class="levs">${evs.map((e) => {
              const abierto = MENU && MENU.i === EVENTS.indexOf(e);
              return `<li>
              <button class="lev${e.busy ? " busy" : ""}" data-i="${EVENTS.indexOf(e)}" tabindex="${e === ROVING ? "0" : "-1"}"${e.busy ? " data-busy" : ""}
                title="${e.title} · ${fmt(e.min)} – ${fmt(e.min + e.dur)}"${e.busy ? "" : ` aria-haspopup="menu" aria-expanded="${abierto ? "true" : "false"}"`}
                aria-label="${DIAS_LARGOS[i]} de septiembre, ${fmt(e.min)} a ${fmt(e.min + e.dur)}, ${e.title}${e.cat ? `, ${cat(e.cat).label}` : ""}${e.busy ? ", importado de Google" : ""}${e.sync && e.sync !== "ok" ? ", sin sincronizar" : ""}">
                <span class="lev-h">${fmt(e.min)} – ${fmt(e.min + e.dur)}</span>
                <span class="lev-t">${e.title}</span>
                ${e.cat && !e.busy ? `<span class="lev-c"><i style="background:${cat(e.cat).color}"></i>${cat(e.cat).label}</span>` : ""}
                ${e.busy ? '<span class="lev-c">de Google</span>' : ""}
                ${e.sync && e.sync !== "ok" ? '<span class="lev-p">sin sincronizar</span>' : ""}
              </button></li>`;
            }).join("")}</ul>`
          : '<p class="lvy">Sin reuniones</p>'}
        </div>
      </section>`;
    }).join("")
  }</div>`;
}

/* La reunión se pinta distinto según la vista (bloque en la grilla, fila en la
   Lista), pero las dos formas llevan data-i y abren el MISMO menú. Este es el
   único punto que conoce las dos: posicionamiento y acciones no se duplican. */
function bloqueDe(i) {
  return document.querySelector(`#grilla .ev[data-i="${i}"], #grilla .lev[data-i="${i}"]`);
}

/* ══════════════════════════════════════════════════════════════════════
   Panel de creación/edición: NO es un modo. Se abre, hace una cosa y se
   cierra; la grilla queda detrás, visible y operable (nunca lo tapa).
   ══════════════════════════════════════════════════════════════════════ */
let PANEL = null;   // { dia, min, dur, evento } | null

function abrirPanel({ dia, min, dur, evento = null }) {
  MENU = null;   // el panel y el menú nunca conviven: abrir el panel cierra el menú
  PANEL = { dia, min, dur, evento };
  mount(current);
  // el panel recién existe tras el re-render de mount(): por eso el foco va en el siguiente frame.
  // Mover el foco ES el anuncio (el nombre accesible trae día, hora y título): nunca se
  // anuncia y se mueve el foco a la vez, son alternativas.
  requestAnimationFrame(() => {
    document.querySelector("#panel input, #panel textarea")?.focus();
  });
}

function cerrarPanel({ volverFoco = true } = {}) {
  PANEL = null;
  mount(current);
  if (volverFoco) requestAnimationFrame(() => {
    // sin evento enfocable (Lista vacía/Mes o grilla vacía) cae en un control estable del stage
    const destino = document.querySelector("#grilla .ev, #grilla .lev")
      || document.querySelector("#stage button");
    destino?.focus();
  });
}

/* Guardar cierra el ciclo: crea o actualiza, re-renderiza y deja el foco en el
   elemento afectado. Mover el foco ES el anuncio (su nombre accesible trae día,
   hora y título): si el foco cambia no se anuncia; si el bloque no se pintó (por
   ejemplo su agenda está oculta) no hay foco posible y entonces sí se anuncia. */
function guardarPanel(datos) {
  const { dia, evento } = PANEL;   // leer antes de cerrar: cerrarPanel deja PANEL en null
  if (evento) {
    evento.title = datos.titulo; evento.min = datos.min; evento.dur = datos.dur;
    cerrarPanel({ volverFoco: false });
    requestAnimationFrame(() => {
      const el = bloqueDe(EVENTS.indexOf(evento));
      if (el) el.focus();
      else announce(`Actualizada ${evento.title}, ${DIAS_LARGOS[dia]} de ${fmt(evento.min)} a ${fmt(evento.min + evento.dur)}`);
    });
    return;
  }
  const nuevo = { day: dia, min: datos.min, dur: datos.dur, title: datos.titulo, cat: "consultora", origin: "CRM", sync: "ok" };
  EVENTS.push(nuevo);
  cerrarPanel({ volverFoco: false });
  requestAnimationFrame(() => {
    const el = bloqueDe(EVENTS.indexOf(nuevo));
    if (el) el.focus();
    else announce(`Creada ${nuevo.title}, ${DIAS_LARGOS[dia]} de ${fmt(nuevo.min)} a ${fmt(nuevo.min + nuevo.dur)}`);
  });
}

function renderPanel() {
  if (!PANEL) return "";
  const { dia, min, dur, evento } = PANEL;
  const fin = min + dur;
  const rango = `${fmt(min)} – ${fmt(fin)}`;
  const titulo = evento ? `Editar · ${evento.title} · ${DIAS_LARGOS[dia]}, ${rango}` : `Nueva reunión · ${DIAS_LARGOS[dia]}, ${rango}`;
  return `<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-titulo">
    <h2 id="panel-titulo">${titulo}</h2>
    <form id="panel-form">
      <label for="p-titulo">Título</label>
      <input id="p-titulo" name="titulo" autocomplete="off" value="${evento ? evento.title : ""}">
      <label for="p-inicio">Hora de inicio</label>
      <p class="p-hint" id="p-inicio-ayuda">Formato 24 h, por ejemplo 09:30</p>
      <input id="p-inicio" name="inicio" inputmode="numeric" value="${fmt(min)}" aria-describedby="p-inicio-ayuda">
      <fieldset><legend>Duración</legend>
        ${[15, 30, 45, 60, 90].map((d) => `<button type="button" class="p-dur${d === dur ? " on" : ""}" data-dur="${d}" aria-pressed="${d === dur}">${d} min</button>`).join("")}
      </fieldset>
      <div class="p-acciones">
        <button type="submit" class="btn primary">Guardar</button>
        <button type="button" class="btn" data-cerrar-panel>Cancelar</button>
      </div>
    </form>
  </aside>`;
}

/* ══════════════════════════════════════════════════════════════════════
   Menú de la reunión: la superficie que vuelve alcanzables sin arrastrar
   las acciones sobre una reunión. `Enter` sobre un bloque enfocado abre el
   menú (un solo significado en todo el prototipo); "Editar" abre el panel.
   Solo se renderizan las acciones YA implementadas: un ítem que no hace
   nada es un defecto. Las tareas 6/7/8 suman su id a ACCIONES_HECHAS.
   ══════════════════════════════════════════════════════════════════════ */
let MENU = null;    // { i, x, y } | null
let ROVING = null;  // evento cuya fila es el único tab stop de la Lista (roving tabindex)

const ACCIONES = [
  { id: "editar",   label: "Editar",            tecla: "E" },
  { id: "mover",    label: "Mover a…",          tecla: "M" },
  { id: "duracion", label: "Cambiar duración…", tecla: "D" },
  { id: "duplicar", label: "Duplicar",          tecla: "" },
  { id: "eliminar", label: "Eliminar",          tecla: "Supr" },
];
const ACCIONES_HECHAS = new Set(["editar", "mover", "duracion", "duplicar", "eliminar"]);

// La tecla que muestra cada ítem tiene que hacer algo (si no, es una promesa falsa):
// los atajos de una letra se comparan directo; "Supr" es multitecla y el navegador
// lo entrega como "Delete" (otros motores, como "Del").
function teclaDeAccion(a, key) {
  const t = (a.tecla || "").toLowerCase();
  if (!t) return false;
  if (t.length === 1) return t === key.toLowerCase();
  return t === "supr" && (key === "Delete" || key === "Del");
}

function abrirMenu(i) {
  const el = bloqueDe(i);
  if (!el || el.hasAttribute("data-busy")) return;   // los importados de Google son de solo lectura
  const r = el.getBoundingClientRect();
  MENU = { i, x: r.left, y: r.bottom + 4 };
  // Se inserta el menú directo en el DOM, sin re-renderizar la grilla: así no se
  // pierde el scroll ni el control bajo el puntero, y el ancla no se corre.
  document.getElementById("menu")?.remove();
  document.querySelectorAll('#grilla .ev[aria-expanded="true"], #grilla .lev[aria-expanded="true"]')
    .forEach((x) => x.setAttribute("aria-expanded", "false"));
  document.getElementById("stage").insertAdjacentHTML("beforeend", renderMenu());
  el.setAttribute("aria-expanded", "true");
  // El foco entra al menú YA: si una flecha llegara en el mismo frame, el menú ya
  // tiene el foco y no se lo trata como huérfano. Mover el foco ES el anuncio:
  // abrir nunca anuncia. El posicionamiento sí espera al layout.
  document.querySelector('#menu [role="menuitem"]')?.focus();
  requestAnimationFrame(posicionarMenu);
}

// Cierra el menú sin re-renderizar ni mover el foco: el control que recibió el
// pointerdown tiene que sobrevivir para que su click llegue.
function desmontarMenu() {
  MENU = null;
  document.getElementById("menu")?.remove();
  document.querySelectorAll('#grilla .ev[aria-expanded="true"], #grilla .lev[aria-expanded="true"]')
    .forEach((x) => x.setAttribute("aria-expanded", "false"));
}

function cerrarMenu({ volverFoco = true } = {}) {
  const i = MENU?.i;
  desmontarMenu();
  // Devolver el foco a la reunión también es el anuncio: cerrar nunca anuncia.
  if (volverFoco) requestAnimationFrame(() => {
    bloqueDe(i)?.focus();
  });
}

// El menú es fixed pero se ancla al bloque: si se saldría de la ventana, se da vuelta.
function posicionarMenu() {
  const m = document.getElementById("menu");
  if (!m || !MENU) return;
  const b = m.getBoundingClientRect();
  const x = Math.max(4, Math.min(MENU.x, innerWidth - b.width - 4));
  let y = MENU.y;
  if (y + b.height > innerHeight - 4) y = MENU.y - b.height - 8;
  y = Math.max(4, Math.min(y, innerHeight - b.height - 4));
  m.style.left = `${x}px`;
  m.style.top = `${y}px`;
}

function renderMenu() {
  if (!MENU) return "";
  const e = EVENTS[MENU.i];
  const acciones = ACCIONES.filter((a) => ACCIONES_HECHAS.has(a.id));
  return `<div id="menu" role="menu" aria-label="Acciones para ${e.title}"
      style="left:${MENU.x}px;top:${MENU.y}px">
    ${acciones.map((a) => `<button type="button" role="menuitem" data-accion="${a.id}" aria-label="${a.label}">${a.label}${a.tecla ? `<span class="m-tecla" aria-hidden="true">${a.tecla}</span>` : ""}</button>`).join("")}
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   "Duplicar" y "Eliminar": acciones del menú. Duplicar es inmediato (una copia
   en el mismo día/hora, y el foco pasa a la copia); Eliminar pide confirmación
   EN LÍNEA dentro del propio menú, no en un modal anidado. Ninguna usa mount():
   paint() recrea la grilla y el scroll se conserva, como en "Mover a…".
   ══════════════════════════════════════════════════════════════════════ */

/* Duplicar NO anuncia: el foco pasa a la copia y su nombre accesible ya trae
   día, hora, título y categoría, así que mover el foco ES el anuncio. El bloque
   que abre el menú está renderizado (su agenda está visible), así que la copia
   —misma categoría y origen— también lo está: el foco siempre tiene destino. */
function duplicarEvento(i) {
  const e = EVENTS[i];
  if (!e) return;
  const copia = { day: e.day, min: e.min, dur: e.dur, title: `${e.title} (copia)`, cat: e.cat, origin: e.origin, sync: e.sync };
  if (e.sub) copia.sub = e.sub;   // lane/laneCount los recalcula renderCol
  EVENTS.push(copia);
  cerrarMenu({ volverFoco: false });
  paintConservandoScroll();
  bloqueDe(EVENTS.indexOf(copia))?.focus();
}

/* La confirmación reemplaza a la lista de acciones DENTRO del mismo #menu.
   El foco entra en "Sí, eliminar", cuyo nombre accesible trae el título: mover
   el foco ES el anuncio de la pregunta (no se anuncia aparte, por alternancia). */
function abrirConfirmarEliminar() {
  if (!MENU) return;
  MENU.confirm = true;
  const m = document.getElementById("menu");
  if (!m) return;
  m.innerHTML = renderConfirmar(MENU.i);
  requestAnimationFrame(() => { posicionarMenu(); document.querySelector("#eliminar-si")?.focus(); });
}

function renderConfirmar(i) {
  const e = EVENTS[i];
  if (!e) return "";
  return `<div id="confirmar-eliminar" role="group" aria-label="Confirmar eliminación de ${e.title}">
    <p class="cm-pregunta">¿Eliminar ${e.title}?</p>
    <button type="button" id="eliminar-si" aria-label="Sí, eliminar ${e.title}">Sí, eliminar</button>
    <button type="button" id="eliminar-no">Cancelar</button>
  </div>`;
}

/* Al borrar, el elemento deja de existir y el foco cae forzosamente en OTRO
   objeto (un vecino o la grilla): el lector leería al vecino, no la eliminación.
   Por eso acá SÍ se anuncia, además de mover el foco.
   Grilla: vecino = bloque más cercano en el mismo día; si el día quedó vacío, va a #grilla.
   Lista (APG): vecino = la fila siguiente en orden de DOM; si era la última, la
   anterior; si el día quedó vacío, la siguiente fila es el primer evento del día
   siguiente; sin filas, el contenedor. MUI tuvo que escribir esto a mano: por eso
   se resuelve explícitamente y se mide. */
function eliminarEvento(i) {
  const e = EVENTS[i];
  if (!e) return;
  const esLista = !!document.getElementById("grilla")?.classList.contains("lista");
  let objetivoLista = null;
  if (esLista) {
    const filas = [...document.querySelectorAll("#grilla .lev")];
    const pos = filas.findIndex((el) => Number(el.dataset.i) === i);
    const vecino = filas[pos + 1] || filas[pos - 1];
    objetivoLista = vecino ? EVENTS[Number(vecino.dataset.i)] : null;
    ROVING = objetivoLista;   // la fila vecina pasa a ser el único tab stop
  }
  MENU = null;
  document.getElementById("menu")?.remove();
  EVENTS.splice(i, 1);
  paintConservandoScroll();
  announce(`Eliminada ${e.title}, ${DIAS_LARGOS[e.day]} a las ${fmt(e.min)}`);
  if (esLista) {
    const destino = objetivoLista ? bloqueDe(EVENTS.indexOf(objetivoLista)) : null;
    if (destino) { destino.focus(); destino.scrollIntoView({ block: "nearest" }); return; }
    document.getElementById("grilla")?.focus();
    return;
  }
  const vecino = vecinoDe(e.day, e.min);
  if (vecino) { vecino.focus(); return; }
  const g = document.getElementById("grilla");
  if (g && g.hasAttribute("tabindex")) { g.focus(); return; }
  document.querySelector("#stage button")?.focus();
}

function vecinoDe(day, min) {
  let mejor = null, dist = Infinity;
  for (const el of document.querySelectorAll("#grilla .ev")) {
    const ev = EVENTS[Number(el.dataset.i)];
    if (!ev || ev.day !== day) continue;
    const d = Math.abs(ev.min - min);
    if (d < dist) { dist = d; mejor = el; }
  }
  return mejor;
}

/* ══════════════════════════════════════════════════════════════════════
   Nudge por teclado: mover y redimensionar la reunión ENFOCADA sin puntero
   (SC 2.1.1: todo es operable por teclado). No usa mount() —que reinicia el
   scroll de la grilla—: repinta conservando el scroll y re-enfoca el bloque.
   Repintar crea un nodo NUEVO cuyo nombre accesible ya trae el día/hora/
   duración nuevos, así que ENFOCARLO ES EL ANUNCIO (alternancia): acá no se
   llama a announce(). El rechazo contra un borde SÍ se anuncia: ahí no hay
   repintado ni cambio de foco y sin mensaje no habría ninguna señal.
   ══════════════════════════════════════════════════════════════════════ */
function nudgeEvento(i) {
  const wrap = document.querySelector(".gridwrap");
  const st = wrap ? wrap.scrollTop : 0;
  paint();
  const wrap2 = document.querySelector(".gridwrap");
  if (wrap2) wrap2.scrollTop = st;   // paint() recrea la grilla: se conserva el scroll
  const el = document.querySelector(`#grilla .ev[data-i="${i}"]`);
  if (el) { el.focus(); el.scrollIntoView({ block: "nearest" }); }
}

// Alt+↑/↓: ±15 min. Contra el borde visible no se mueve y se dice por qué.
function moverEvento(i, deltaMin) {
  const e = EVENTS[i];
  if (!e) return;
  const nuevo = e.min + deltaMin;
  if (nuevo < START_H * 60 || nuevo + e.dur > END_H * 60) {
    announce(`${e.title} no entra en el horario visible`);
    return;
  }
  e.min = nuevo;
  nudgeEvento(i);
}

// Alt+←/→: ±1 día, acotado a la ventana Lun–Vie.
function moverEventoDia(i, deltaDias) {
  const e = EVENTS[i];
  if (!e) return;
  const dia = e.day + deltaDias;
  if (dia < 0 || dia >= DAYS.length) {
    announce(`${e.title} ya está en el borde de la semana`);
    return;
  }
  e.day = dia;
  nudgeEvento(i);
}

// Shift+↑/↓: ±15 min de duración, sin pasar el fin del rango ni bajar de 15.
function cambiarDuracion(i, deltaMin) {
  const e = EVENTS[i];
  if (!e) return;
  const dur = e.dur + deltaMin;
  if (dur < DUR_MIN || e.min + dur > END_H * 60) {
    announce(`${e.title} no puede tener esa duración en el horario visible`);
    return;
  }
  e.dur = dur;
  nudgeEvento(i);
}

/* ══════════════════════════════════════════════════════════════════════
   "Mover a…": mover una reunión sin arrastrar (SC 2.5.7). Es una superficie
   con BORRADOR: nada toca el evento hasta Aplicar y Escape no escribe. Igual
   que el menú se inserta directo en #stage; NO se usa mount(), que resetea el
   scroll de la grilla. Los controles son <button>, así el camino de puntero y
   el de teclado son el mismo.
   ══════════════════════════════════════════════════════════════════════ */
let MOVER = null;                  // { i, dia, min } — borrador, no el evento
let MOVER_ANCHOR = { x: 0, y: 0 }; // rect del bloque que lo abrió

function abrirMover(i) {
  const el = bloqueDe(i);
  if (!el || !EVENTS[i]) return;
  const e = EVENTS[i];
  MOVER = { i, dia: e.day, min: e.min };
  const r = el.getBoundingClientRect();
  MOVER_ANCHOR = { x: r.left, y: r.bottom + 4 };
  desmontarMenu();   // el diálogo reemplaza al menú; el foco pasa adentro, por eso abrir nunca anuncia
  document.getElementById("mover-dialog")?.remove();
  document.getElementById("stage").insertAdjacentHTML("beforeend", renderMover());
  requestAnimationFrame(() => {
    posicionarMover();
    // Mover el foco ES el anuncio: abrir no anuncia.
    const primero = document.querySelector("#mover-dialog [data-paso]:not(:disabled)")
      || document.querySelector("#mover-dialog button");
    primero?.focus();
  });
}

function cerrarMover({ volverFoco = true } = {}) {
  const i = MOVER?.i;
  MOVER = null;
  document.getElementById("mover-dialog")?.remove();
  // Devolver el foco a la reunión también es el anuncio: cerrar no anuncia.
  if (volverFoco) requestAnimationFrame(() => {
    bloqueDe(i)?.focus();
  });
}

/* Aplicar es el único punto que escribe. Al terminar, el foco vuelve al evento
   afectado y su nombre accesible ya trae el día y la hora nuevos: mover el foco
   ES el anuncio, así que no se escribe además la región viva (alternancia). */
function aplicarMover() {
  if (!MOVER) return;
  const m = MOVER;
  const e = EVENTS[m.i];
  e.day = m.dia;
  e.min = m.min;
  cerrarMover({ volverFoco: false });
  paintConservandoScroll();
  bloqueDe(m.i)?.focus();
}

// El borde del rango se corta con disabled: el control que no puede mover no se
// ofrece, en vez de aceptar y recortar en silencio.
function pasoPermitido(delta) {
  const e = EVENTS[MOVER.i];
  return MOVER.min + delta >= START_H * 60 && MOVER.min + delta + e.dur <= END_H * 60;
}

function pintarMover() {
  const d = document.getElementById("mover-dialog");
  if (!d || !MOVER) return;
  const e = EVENTS[MOVER.i];
  d.querySelector("#mover-hora").textContent =
    `${DIAS_LARGOS[MOVER.dia]} de septiembre, ${fmt(MOVER.min)} – ${fmt(MOVER.min + e.dur)}`;
  d.querySelectorAll("[data-paso]").forEach((b) => {
    const ok = pasoPermitido(Number(b.dataset.paso));
    b.disabled = !ok;
    b.setAttribute("aria-disabled", String(!ok));
  });
  d.querySelectorAll("[data-dia]").forEach((b) => {
    const on = Number(b.dataset.dia) === MOVER.dia;
    b.setAttribute("aria-pressed", String(on));
    b.classList.toggle("on", on);
  });
}

// Misma estrategia que el menú: fixed, anclada al bloque y clameada a la ventana.
function posicionarMover() {
  const d = document.getElementById("mover-dialog");
  if (!d || !MOVER) return;
  const b = d.getBoundingClientRect();
  const x = Math.max(4, Math.min(MOVER_ANCHOR.x, innerWidth - b.width - 4));
  let y = MOVER_ANCHOR.y;
  if (y + b.height > innerHeight - 4) y = MOVER_ANCHOR.y - b.height - 8;
  y = Math.max(4, Math.min(y, innerHeight - b.height - 4));
  d.style.left = `${x}px`;
  d.style.top = `${y}px`;
}

function renderMover() {
  if (!MOVER) return "";
  const e = EVENTS[MOVER.i];
  const pasos = ["-60", "-15", "+15", "+60"].map((p) => {
    const label = p === "-60" ? "−1 h" : p === "-15" ? "−15 min" : p === "+60" ? "+1 h" : "+15 min";
    const ok = pasoPermitido(Number(p));
    return `<button type="button" data-paso="${p}" aria-label="${label}" aria-disabled="${!ok}" ${ok ? "" : "disabled"}>${label}</button>`;
  }).join("");
  // Los cinco destinos SON la ventana Lun-Vie: no hay destino fuera de rango que deshabilitar.
  const dias = DAYS.map((d, i) => {
    const on = i === MOVER.dia;
    return `<button type="button" data-dia="${i}" class="${on ? "on" : ""}" aria-pressed="${on}" aria-disabled="false" aria-label="${DIAS_LARGOS[i]} de septiembre">${d}</button>`;
  }).join("");
  return `<div id="mover-dialog" role="dialog" aria-modal="false" aria-labelledby="mover-titulo"
      style="left:${MOVER_ANCHOR.x}px;top:${MOVER_ANCHOR.y}px">
    <h2 id="mover-titulo">Mover · ${e.title}</h2>
    <p class="mv-hora" id="mover-hora">${DIAS_LARGOS[MOVER.dia]} de septiembre, ${fmt(MOVER.min)} – ${fmt(MOVER.min + e.dur)}</p>
    <span class="mv-lab" id="mover-pasos-lab">Ajustar hora</span>
    <div class="mv-pasos" role="group" aria-labelledby="mover-pasos-lab">${pasos}</div>
    <span class="mv-lab" id="mover-dia-lab">Mover al día</span>
    <div class="mv-dias" role="group" aria-labelledby="mover-dia-lab">${dias}</div>
    <div class="mv-acciones">
      <button type="button" class="btn primary" id="mover-aplicar">Aplicar</button>
      <button type="button" class="btn" id="mover-cancelar">Cancelar</button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   "Cambiar duración…": redimensionar sin arrastrar (SC 2.5.7). Espeja
   "Mover a…": borrador + Aplicar, Escape no escribe, sin mount() y con los
   presets/pasos como <button>, así el puntero y el teclado usan lo mismo.
   ══════════════════════════════════════════════════════════════════════ */
let DUR = null;                    // { i, dur } — borrador, no el evento
let DUR_ANCHOR = { x: 0, y: 0 };   // rect del bloque que lo abrió
const DUR_PRESETS = [15, 30, 45, 60, 90, 120];
const DUR_MIN = 15;

function abrirDur(i) {
  const el = bloqueDe(i);
  if (!el || !EVENTS[i]) return;
  const e = EVENTS[i];
  DUR = { i, dur: e.dur };   // releer la duración actual: nunca confiar en estado viejo entre aperturas
  const r = el.getBoundingClientRect();
  DUR_ANCHOR = { x: r.left, y: r.bottom + 4 };
  desmontarMenu();   // el diálogo reemplaza al menú; el foco pasa adentro, por eso abrir nunca anuncia
  document.getElementById("dur-dialog")?.remove();
  document.getElementById("stage").insertAdjacentHTML("beforeend", renderDur());
  requestAnimationFrame(() => {
    posicionarDur();
    // Mover el foco ES el anuncio: abrir no anuncia.
    document.querySelector("#dur-dialog button:not(:disabled)")?.focus();
  });
}

function cerrarDur({ volverFoco = true } = {}) {
  const i = DUR?.i;
  DUR = null;
  document.getElementById("dur-dialog")?.remove();
  // Devolver el foco a la reunión también es el anuncio: cerrar no anuncia.
  if (volverFoco) requestAnimationFrame(() => {
    bloqueDe(i)?.focus();
  });
}

/* Aplicar es el único punto que escribe. Al terminar, el foco vuelve al evento
   afectado y su nombre accesible ya trae la duración nueva (hora de fin incluida):
   mover el foco ES el anuncio, así que no se escribe además la región viva. */
function aplicarDur() {
  if (!DUR) return;
  const d = DUR;
  const e = EVENTS[d.i];
  e.dur = d.dur;
  cerrarDur({ volverFoco: false });
  paintConservandoScroll();
  bloqueDe(d.i)?.focus();
}

// El control que no puede cambiar la duración no se ofrece, en vez de recortar
// en silencio: ni por debajo de 15 min ni pasando el fin del rango visible.
function presetPermitido(dur) {
  return EVENTS[DUR.i].min + dur <= END_H * 60;
}
function pasoDurPermitido(delta) {
  return DUR.dur + delta >= DUR_MIN && presetPermitido(DUR.dur + delta);
}

function pintarDur() {
  const d = document.getElementById("dur-dialog");
  if (!d || !DUR) return;
  const e = EVENTS[DUR.i];
  d.querySelector("#dur-hora").textContent =
    `${DIAS_LARGOS[e.day]} de septiembre, ${fmt(e.min)} – ${fmt(e.min + DUR.dur)}`;
  d.querySelectorAll("[data-dpreset]").forEach((b) => {
    const v = Number(b.dataset.dpreset);
    const ok = presetPermitido(v);
    b.disabled = !ok;
    b.setAttribute("aria-disabled", String(!ok));
    const on = v === DUR.dur;
    b.setAttribute("aria-pressed", String(on));
    b.classList.toggle("on", on);
  });
  d.querySelectorAll("[data-dpaso]").forEach((b) => {
    const ok = pasoDurPermitido(Number(b.dataset.dpaso));
    b.disabled = !ok;
    b.setAttribute("aria-disabled", String(!ok));
  });
}

// Misma estrategia que el menú y "Mover a…": fixed, anclada al bloque y clameada.
function posicionarDur() {
  const d = document.getElementById("dur-dialog");
  if (!d || !DUR) return;
  const b = d.getBoundingClientRect();
  const x = Math.max(4, Math.min(DUR_ANCHOR.x, innerWidth - b.width - 4));
  let y = DUR_ANCHOR.y;
  if (y + b.height > innerHeight - 4) y = DUR_ANCHOR.y - b.height - 8;
  y = Math.max(4, Math.min(y, innerHeight - b.height - 4));
  d.style.left = `${x}px`;
  d.style.top = `${y}px`;
}

function renderDur() {
  if (!DUR) return "";
  const e = EVENTS[DUR.i];
  const presets = DUR_PRESETS.map((v) => {
    const ok = presetPermitido(v);
    const on = v === DUR.dur;
    return `<button type="button" data-dpreset="${v}" class="${on ? "on" : ""}" aria-pressed="${on}" aria-label="${v} minutos" aria-disabled="${!ok}" ${ok ? "" : "disabled"}>${v} min</button>`;
  }).join("");
  const pasos = ["-15", "+15"].map((p) => {
    const ok = pasoDurPermitido(Number(p));
    const label = p === "-15" ? "−15 min" : "+15 min";
    return `<button type="button" data-dpaso="${p}" aria-label="${label}" aria-disabled="${!ok}" ${ok ? "" : "disabled"}>${label}</button>`;
  }).join("");
  return `<div id="dur-dialog" role="dialog" aria-modal="false" aria-labelledby="dur-titulo"
      style="left:${DUR_ANCHOR.x}px;top:${DUR_ANCHOR.y}px">
    <h2 id="dur-titulo">Cambiar duración · ${e.title}</h2>
    <p class="du-hora" id="dur-hora">${DIAS_LARGOS[e.day]} de septiembre, ${fmt(e.min)} – ${fmt(e.min + DUR.dur)}</p>
    <span class="du-lab" id="dur-presets-lab">Duración</span>
    <div class="du-presets" role="group" aria-labelledby="dur-presets-lab">${presets}</div>
    <span class="du-lab" id="dur-pasos-lab">Ajustar</span>
    <div class="du-pasos" role="group" aria-labelledby="dur-pasos-lab">${pasos}</div>
    <div class="du-acciones">
      <button type="button" class="btn primary" id="dur-aplicar">Aplicar</button>
      <button type="button" class="btn" id="dur-cancelar">Cancelar</button>
    </div>
  </div>`;
}

function render() {
  const g = geom();
  const visibles = EVENTS.filter((e) => !oculto(e));
  const shown = EVENTS.filter((e) => !e.busy && !oculto(e));
  const total = shown.length;
  const pendientes = shown.filter((e) => e.sync && e.sync !== "ok").length;
  const now = 15 * 60 + 42;
  const inFold = (m) => g.segs.some((s) => s.collapsed && m > s.from && m < s.to);
  const gutter = `<div class="gutter" aria-hidden="true" style="height:${g.gridH}px">${
    Array.from({ length: END_H - START_H + 1 }, (_, i) => START_H + i)
      .filter((h) => !inFold(h * 60))
      .map((h) => {
        const ty = h === START_H ? "translateY(0)" : h === END_H ? "translateY(-100%)" : "translateY(-50%)";
        return `<span class="hourlab" style="top:${g.yOf(h * 60)}px;transform:${ty}">${fmt(h * 60)}</span>`;
      })
      .join("")
  }</div>`;
  // la ventana visible se dice explícitamente, y cuánto se plegó
  const vis = g.segs.filter((s) => !s.collapsed);
  const visFrom = vis.length ? vis[0].from : START_H * 60;
  const visTo = vis.length ? vis[vis.length - 1].to : END_H * 60;
  const folded = g.segs.filter((s) => s.collapsed).reduce((a, s) => a + (s.to - s.from), 0);
  const windowChip = `${fmt(visFrom)} – ${fmt(visTo)}${folded ? ` · ${Math.round(folded / 60)} h plegadas` : ""}`;

  return `<div class="shell" data-variant="${VARIANT}" data-panel="${PANEL ? "on" : "off"}">
    <aside class="side">
      <div>
        <h2 class="block-title">Agendas</h2>
        ${Object.entries(CATS).map(([k, v]) => `<button class="cal" data-cat="${k}" ${HIDDEN.has(k) ? "data-off" : ""} aria-pressed="${!HIDDEN.has(k)}">
          <span class="dot" style="background:${tint(v.color)}"></span>
          <span class="name">${v.label}</span>
          <span class="count">${EVENTS.filter((e) => e.cat === k).length}</span>
        </button>`).join("")}
      </div>
      <div>
        <h2 class="block-title">Origen</h2>
        ${["CRM", "Reserva web", "Google"].map((o) => `<button class="cal" data-origin="${o}" ${HIDDEN_ORIGIN.has(o) ? "data-off" : ""} aria-pressed="${!HIDDEN_ORIGIN.has(o)}">
          <span class="dot" style="background:var(--fg-faint)"></span><span class="name">${o}</span>
          <span class="count">${EVENTS.filter((e) => (e.origin || "").startsWith(o.split(" ")[0])).length}</span>
        </button>`).join("")}
      </div>
      <div>
        <h2 class="block-title">Buscador</h2>
        <input class="btn" style="width:100%;text-align:left;color:var(--fg-dim)" value="Buscar…  ⌘\u00a0K" readonly aria-label="Buscar reuniones" name="q" autocomplete="off">
      </div>
    </aside>

    <main>
      <div class="topbar">
        <h1 class="rangetitle">${VIEW === "mes" ? "Septiembre" : "15 – 19 de septiembre"}</h1>
        <span class="rangecount">${VIEW === "mes" ? `${MES.dias} días` : windowChip} · ${total} reuniones${pendientes ? ` · ${pendientes} sin sincronizar` : ""}</span>
        <span class="right">
          <div class="seg" role="group" aria-label="Vista">
            <button data-view="semana" class="${VIEW === "semana" ? "on" : ""}" aria-pressed="${VIEW === "semana"}">Semana</button>
            <button data-view="lista" class="${VIEW === "lista" ? "on" : ""}" aria-pressed="${VIEW === "lista"}">Lista</button>
            <button data-view="mes" class="${VIEW === "mes" ? "on" : ""}" aria-pressed="${VIEW === "mes"}">Mes</button>
          </div>
          ${VIEW === "semana" ? `<button class="btn mini-toggle" title="Mostrar u ocultar el panel del mes" aria-pressed="false" aria-label="Panel del mes">Panel</button>` : ""}
          ${VIEW === "semana" && VARIANT === "zoom"
            ? `<div class="zoomctl" role="group" aria-label="Densidad del calendario">${ZOOM_STEPS
                .map(({ m, label }) => `<button data-z="${m}" class="${m === ZOOM_MULT ? "on" : ""}" aria-pressed="${m === ZOOM_MULT}">${label}</button>`)
                .join("")}</div>`
            : ""}
          <button class="btn hoy-btn" data-now title="Ir a la hora actual (H)">Hoy · ${fmt(NOW_MIN)}</button>
          <button class="btn primary" data-nueva title="Nueva reunión en la hora actual (N)">Nueva reunión</button>
        </span>
      </div>
      ${VIEW === "mes" ? renderMonth() : VIEW === "lista" ? renderList() : `<div class="gridwrap" tabindex="0" role="region" aria-label="Agenda de la semana del 15 al 19 de septiembre">
        <div class="heads">
          ${VARIANT === "flujo" ? '<div class="colhead"></div>' : '<div class="colhead"></div>'}
          ${DAYS.map((d, i) => `<div class="colhead${i === 1 ? " today" : ""}">
            <span class="dow">${d.split(" ")[0]}</span><span class="dom">${d.split(" ")[1]}</span></div>`).join("")}
        </div>
        <div class="days" id="grilla" tabindex="-1">
          ${gutter}
          ${DAYS.map((_, i) => renderCol(i, g)).join("")}
          ${bandOverlay(g)}
          ${visibles.length === 0 ? `<div class="grid-empty">
            <p class="ge-t">No hay reuniones para mostrar</p>
            <p class="ge-s">Activá una agenda en la barra de la izquierda, o creá la primera reunión de la semana.</p>
            <button class="btn primary" data-nueva title="Nueva reunión en la hora actual (N)">Nueva reunión</button>
          </div>` : ""}
        </div>
      </div>`}
    </main>

    ${renderPanel()}
    ${renderMenu()}

    <aside class="mini">
      <div>
        <h2 class="block-title">Septiembre</h2>
        <div class="mgrid">
          ${["L", "M", "M", "J", "V", "S", "D"].map((x) => `<span class="h">${x}</span>`).join("")}
          ${Array.from({ length: 35 }, (_, i) => {
            const d = i - 0;
            const isRange = d >= 15 && d <= 19, isToday = d === 16, hasEv = d >= 15 && d <= 19 && d % 2 === 0;
            return `<span class="${isRange ? "inrange " : ""}${isToday ? "today " : ""}${hasEv ? "has-ev" : ""}">${d < 1 || d > 30 ? "" : d}</span>`;
          }).join("")}
        </div>
      </div>
      <div>
        <h2 class="block-title">Cómo se lee</h2>
        <div class="legend">
          ${Object.values(CATS).map((v) => `<div><i style="background:${tint(v.color)}"></i>${v.label}</div>`).join("")}
          <div><i style="background:#211f1b;box-shadow:inset 0 0 0 1px rgba(244,241,234,.07)"></i>Ocupado (de Google)</div>
        </div>
      </div>
    </aside>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   Interacción: crear arrastrando · mover · estirar · snap 15 (1:1, springs)
   ══════════════════════════════════════════════════════════════════════ */
let drag = null, lab = null;
const DRAG_UMBRAL = 4;   // menos de esto es un click, no un arrastre
let downEn = null;       // dónde empezó el puntero, para medir el desplazamiento

/* Un solo puntero, sin arrastrar: click en el hueco abre el panel con ese día y hora.
   Si hubo desplazamiento (> 4 px) se trata como arrastre y el panel no se abre. */
function slotDesdeClick(ev, col) {
  const r = col.getBoundingClientRect();
  const g = geom();
  const min = Math.round(g.minOf(ev.clientY - r.top) / 30) * 30;
  return { dia: Number(col.dataset.day), min: Math.max(START_H * 60, Math.min(END_H * 60 - 30, min)) };
}

function ensureLab() {
  if (!lab) { lab = document.createElement("div"); lab.className = "droplab"; document.body.appendChild(lab); }
  return lab;
}

function onDown(ev) {
  downEn = null;
  if (ev.target.closest(".bandfold, .zoomctl")) return;
  const col = ev.target.closest(".col");
  if (!col) return;
  downEn = { x: ev.clientX, y: ev.clientY };
  const g = geom();
  const day = Number(col.dataset.day);
  const y = ev.clientY - col.getBoundingClientRect().top;
  const el = ev.target.closest(".ev");

  if (el && el.hasAttribute("data-busy")) return;

  if (el) {
    const e = EVENTS[Number(el.dataset.i)];
    const resizing = !!ev.target.closest(".grip");
    drag = { kind: resizing ? "resize" : "move", e, day, y0: y, min0: e.min, dur0: e.dur, moved: false };
    el.style.zIndex = 20;
    el.style.boxShadow = "0 10px 30px rgba(0,0,0,.5), 0 0 0 1px var(--border-2)";
  } else {
    const start = snap(g.minOf(y));
    drag = { kind: "create", day, min0: start, dur0: 15, y0: y, moved: false };
  }
  ev.preventDefault();
}

function onMove(ev) {
  if (!drag) return;
  const g = geom();
  const days = document.querySelectorAll(".col");
  drag.moved = true;

  if (drag.kind === "create") {
    const day = drag.day;
    const y = ev.clientY - days[day].getBoundingClientRect().top;
    const cur = snap(g.minOf(y));
    const min = Math.min(drag.min0, cur);
    const dur = Math.max(15, Math.abs(cur - drag.min0) + (cur > drag.min0 ? 0 : 15));
    paintGhost(day, min, dur, g);
    showLab(ev, `${fmt(min)} – ${fmt(min + dur)}`, false);
  } else {
    const e = drag.e;
    if (drag.kind === "resize") {
      const y = ev.clientY - days[e.day].getBoundingClientRect().top;
      e.dur = Math.max(15, snap(g.minOf(y)) - e.min);
      showLab(ev, `${fmt(e.min)} – ${fmt(e.min + e.dur)}`, overlaps(e));
      paint();
    } else {
      const day = drag.day;
      const y = ev.clientY - days[day].getBoundingClientRect().top;
      const delta = snap(g.minOf(y)) - snap(g.minOf(drag.y0));
      e.min = Math.max(START_H * 60, Math.min(END_H * 60 - e.dur, drag.min0 + delta));
      e.day = day;
      showLab(ev, `${fmt(e.min)} – ${fmt(e.min + e.dur)}`, overlaps(e));
      paint();
    }
  }
}

function paintGhost(day, min, dur, g) {
  let gh = document.getElementById("ghost");
  if (!gh) {
    gh = document.createElement("div");
    gh.id = "ghost"; gh.className = "ev";
    gh.style.pointerEvents = "none"; gh.style.opacity = ".8"; gh.style.zIndex = 15;
  }
  const col = document.querySelector(`.col[data-day="${day}"]`);
  if (gh.parentElement !== col) col.appendChild(gh);
  gh.style.top = g.yOf(min) + "px";
  gh.style.height = Math.max((dur / 60) * g.hourH - 2, 22) + "px";
  gh.style.background = "color-mix(in srgb, var(--accent) 20%, #141417)";
  gh.style.borderRadius = VARIANT === "flujo" ? "999px" : "9px";
  gh.style.boxShadow = "inset 0 0 0 1px var(--accent-line)";
  gh.innerHTML = `<span class="t">${fmt(min)} – ${fmt(min + dur)}</span><span class="m">Nueva reunión</span>`;
}

function showLab(ev, text, clash) {
  const l = ensureLab();
  l.style.left = ev.clientX + "px";
  l.style.top = ev.clientY + "px";
  l.innerHTML = `<b>${text}</b>${clash ? " · <em>se superpone</em>" : ""}`;
  l.style.display = "block";
}

/* SC 2.5.2: cancelar es una salida de primera clase. El gesto confirma recién en
   pointerup (nunca en down); Escape a mitad del arrastre, soltar fuera de la
   grilla y un pointercancel del sistema no escriben. Move/resize ya mutaron el
   evento y repintaron durante el gesto, así que se restauran min0/dur0. */
function cancelDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  downEn = null;
  if (lab) lab.style.display = "none";
  document.getElementById("ghost")?.remove();
  if (d.kind === "resize" && d.e) d.e.dur = d.dur0;
  if (d.kind === "move" && d.e) d.e.min = d.min0;
  if (d.kind !== "create") paint();
}

function onUp(ev) {
  if (!drag) return;
  // soltar fuera de la grilla cancela (SC 2.5.2): no se crea ni se mueve nada
  if (!ev || !ev.target || !ev.target.closest || !ev.target.closest("#grilla")) { cancelDrag(); return; }
  const d = drag; drag = null;
  if (lab) lab.style.display = "none";
  document.getElementById("ghost")?.remove();

  // click quieto (menos de 4 px): el arrastre crea como siempre, el click en un
  // hueco abre el panel y el click sobre una reunión abre su menú.
  const quieto = !!downEn && !!ev &&
    Math.abs(ev.clientX - downEn.x) < DRAG_UMBRAL && Math.abs(ev.clientY - downEn.y) < DRAG_UMBRAL;
  downEn = null;
  if (quieto && d.kind === "move") { abrirMenu(EVENTS.indexOf(d.e)); return; }
  if (quieto && d.kind === "create") {
    const col = document.querySelector(`.col[data-day="${d.day}"]`);
    if (col) {
      const { dia, min } = slotDesdeClick(ev, col);
      abrirPanel({ dia, min, dur: 45 });   // 45 min por defecto (spec S2)
      return;
    }
  }
  if (d.moved && d.kind === "create") {
    EVENTS.push({ day: d.day, min: d.min0, dur: d.dur || 30, title: "Nueva reunión", cat: "trabajo", origin: "CRM", sync: "pend" });
  }
  paint();
}

function paint() {
  const stage = document.getElementById("stage");
  const obj = stage.querySelector("[data-variant]");
  if (!obj) return;
  const v = VARIANT; stage.innerHTML = render();
  VARIANT = v;
  // el now line se redibuja y los listeners se re-enganchan
  document.querySelectorAll(".col").forEach((c) => {
    if (!c.querySelector(".slots")) return;
  });
  needle();
}

/* Acciones y diálogos repintan sin usar mount() para no resetear el scroll del
   contenedor activo. En Semana es .gridwrap; en Lista, .lista. */
function paintConservandoScroll() {
  const w = document.querySelector(".gridwrap") || document.querySelector(".lista");
  const st = w ? w.scrollTop : 0;
  paint();
  const w2 = document.querySelector(".gridwrap") || document.querySelector(".lista");
  if (w2) w2.scrollTop = st;
}

function needle() {
  document.querySelector(".nowline")?.remove();
  document.querySelectorAll(".inlinetime").forEach((n) => n.remove());
  const g = geom();
  const line = document.createElement("div");
  line.className = "nowline";
  line.style.top = g.yOf(NOW_MIN) + "px";
  line.innerHTML = '<div class="knob"></div><div class="bar"></div>';
  document.querySelector('.col[data-day="1"]')?.appendChild(line);
}

stage.addEventListener("submit", (ev) => {

  // Y solo mientras el foco esté ADENTRO: si se fue, el menú es un huérfano que se limpia.
  const menu = document.getElementById("menu");

    // escaparse dejando la confirmación a medias); Escape cancela y no escribe.
    if (MENU.confirm) {
      const ctr = [...menu.querySelectorAll("#confirmar-eliminar button")];
      const ci = ctr.indexOf(document.activeElement);
      const dir = e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey) ? -1 : 1;
      if (e.key === "Escape") { cerrarMenu(); e.preventDefault(); return; }

        ctr[(ci + dir + ctr.length) % ctr.length]?.focus();
        e.preventDefault(); return;

      if (e.key === "Enter" || e.key === " ") { document.activeElement?.click(); e.preventDefault(); return; }

    const idx = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { items[(idx + 1) % items.length]?.focus(); e.preventDefault(); return; }

    if (e.key === "Escape" || e.key === "Tab") { cerrarMenu(); e.preventDefault(); return; }
    if (e.key === "Enter" || e.key === " ") { document.activeElement?.click(); e.preventDefault(); return; }

    return;
  }
  // Enter/Space sobre una reunión enfocada abre el menú (no el panel: editar es un ítem)
  if ((e.key === "Enter" || e.key === " ") && e.target.closest(".gridwrap") && e.target.classList.contains("ev")) {
    e.preventDefault();
    // los bloques ocupados de Google se importan de solo lectura: no se editan
    if (!e.target.hasAttribute("data-busy")) abrirMenu(Number(e.target.dataset.i));
    return;
  }
  if (e.target.closest(".gridwrap")) { scrollKeys(e); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= VARIANTS.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % VARIANTS.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + VARIANTS.length) % VARIANTS.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
