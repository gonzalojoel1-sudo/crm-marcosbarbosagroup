<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Grilla de agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens reales del CRM (copiados de apps/web/src/styles.css) ───────── */
:root {
  --bg: #0c0c0e;
  --surface: #141417;
  --surface-2: #1a1a1f;
  --border: rgba(255, 255, 255, 0.08);
  --border-2: rgba(255, 255, 255, 0.15);
  --fg: #f2f0eb;
  --fg-dim: #8e8c94;
  --fg-faint: #5c5a62;
  --accent: #fe4100;
  --accent-2: #ff5c1f;
  --accent-soft: rgba(254, 65, 0, 0.12);
  --accent-line: rgba(254, 65, 0, 0.26);
  --danger: #ff5a5a;
  --ok: #34d399;
  --r: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --ease: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.45 Outfit, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 999px; border: 3px solid var(--bg); }

#stage { min-height: 100vh; }

/* ── Shell común a las tres variantes ─────────────────────────────────── */
.shell { display: grid; grid-template-columns: 212px 1fr 208px; gap: 14px; padding: 16px 18px 96px; min-height: 100vh; }
.side, .mini { display: flex; flex-direction: column; gap: 18px; }
.block-title {
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--fg-faint); margin: 0 0 7px;
}
.cal { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; cursor: pointer; transition: background 140ms ease-out; }
.cal:hover { background: var(--surface); }
.cal .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.cal .name { font-size: 13px; color: var(--fg); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .count { font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.cal[data-off] .name, .cal[data-off] .count { color: var(--fg-faint); }
.cal[data-off] .dot { opacity: .3; }
.chev { margin-left: auto; color: var(--fg-faint); }

.topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.rangetitle { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.rangecount { font-size: 12.5px; color: var(--fg-dim); }
.topbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--fg);
  font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
  transition: border-color 140ms ease-out, background 140ms ease-out;
}
.btn:hover { border-color: var(--border-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); }
.seg { display: inline-flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { background: none; border: 0; color: var(--fg-dim); font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface-2); color: var(--fg); }

.gridwrap { position: relative; }
.heads { display: grid; gap: 0; }
.days { display: grid; position: relative; }
.gutter { position: relative; }
.hourlab {
  position: absolute; right: 8px; font-size: 11px; color: var(--fg-faint);
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.col { position: relative; }
.colhead { display: flex; align-items: baseline; justify-content: center; gap: 5px; }
.colhead .dow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-faint); }
.colhead .dom { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.colhead.today .dom { color: var(--accent-2); }
.hourline { position: absolute; left: 0; right: 0; pointer-events: none; }

.nowline { position: absolute; left: 0; right: 0; z-index: 5; pointer-events: none; }
.nowline .bar { height: 1.5px; background: var(--accent); }
.nowline .knob { position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }

.ev { position: absolute; left: 4px; right: 4px; overflow: hidden; cursor: grab; text-align: left; font: inherit; color: var(--fg); }
.ev:active { cursor: grabbing; }
.ev .t { font-weight: 600; }
.ev .m { font-size: 11.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.ev .grip { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; }
.ev[data-compact] .grip { height: 5px; }
.ev[data-busy] { cursor: default; }
.ev .sync { width: 7px; height: 7px; border-radius: 999px; display: inline-block; margin-left: 5px; }
.sync.ok { background: var(--ok); }
.sync.pend { background: #f59e0b; }
.sync.fail { background: var(--danger); }

.droplab {
  position: fixed; z-index: 40; transform: translate(-50%, -124%);
  background: rgba(10,10,10,.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-radius: 8px; padding: 4px 9px; font-size: 12px; font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset, 0 6px 18px rgba(0,0,0,.4);
  pointer-events: none; white-space: nowrap;
}
.droplab b { font-weight: 600; }
.droplab em { font-style: normal; color: var(--danger); }

.mini .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini .mgrid span { font-size: 11.5px; text-align: center; color: var(--fg-dim); padding: 3px 0; border-radius: 6px; font-variant-numeric: tabular-nums; }
.mini .mgrid span.h { color: var(--fg-faint); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.mini .mgrid span.inrange { background: var(--surface); color: var(--fg); }
.mini .mgrid span.today { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.mini .mgrid span.ev::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 999px; background: var(--fg-faint); margin: 2px auto 0; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--fg-dim); }
.legend div { display: flex; align-items: center; gap: 7px; }
.legend i { width: 16px; height: 9px; border-radius: 3px; display: block; }

/* ═══════════════════════════════════════════════════════════════════════
   VARIANTE 1 · PRECISO — la grilla es la protagonista
   Hairlines al 9%, gutter monoespaciada, el evento es una línea etiquetada.
   ═══════════════════════════════════════════════════════════════════════ */
[data-variant="preciso"] .heads, [data-variant="preciso"] .days { grid-template-columns: 56px repeat(5, 1fr); }
[data-variant="preciso"] .colhead { padding: 8px 0 9px; border-bottom: 1px solid rgba(255,255,255,.09); }
[data-variant="preciso"] .hourline { border-top: 1px solid rgba(255,255,255,.085); }
[data-variant="preciso"] .hourline.half { border-top: 1px dashed rgba(255,255,255,.045); }
[data-variant="preciso"] .col { border-right: 1px solid rgba(255,255,255,.085); }
[data-variant="preciso"] .col:last-child { border-right: 0; }
[data-variant="preciso"] .ev {
  border: 0; padding: 3px 7px; border-radius: 5px;
  background: color-mix(in srgb, var(--c) 13%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 32%, transparent);
}
[data-variant="preciso"] .ev[data-compact] { padding: 2px 7px; }
[data-variant="preciso"] .ev .t { font-size: 12.5px; display: block; line-height: 1.25; }
[data-variant="preciso"] .ev .m { font-size: 11px; display: block; }
[data-variant="preciso"] .ev .k { display: none; }
[data-variant="preciso"] .ev[data-compact] .m { display: none; }
[data-variant="bloque"] .ev[data-compact] { padding: 5px 9px; }
[data-variant="bloque"] .ev[data-compact] .t { font-size: 12.5px; }
[data-variant="preciso"] .slot:hover { background: rgba(255,255,255,.02); }

/* ═══════════════════════════════════════════════════════════════════════
   VARIANTE 2 · BLOQUE — el evento es la protagonista
   Relleno suave con peso, la grilla como andamio casi invisible.
   ═══════════════════════════════════════════════════════════════════════ */
[data-variant="bloque"] .heads, [data-variant="bloque"] .days { grid-template-columns: 62px repeat(5, 1fr); }
[data-variant="bloque"] .colhead { padding: 12px 0 12px; }
[data-variant="bloque"] .hourline { border-top: 1px solid rgba(255,255,255,.035); }
[data-variant="bloque"] .hourline.half { border-top: 0; }
[data-variant="bloque"] .col { border-right: 1px solid rgba(255,255,255,.03); }
[data-variant="bloque"] .col:last-child { border-right: 0; }
[data-variant="bloque"] .ev {
  background: color-mix(in srgb, var(--c) 22%, #141417);
  border-radius: 10px; padding: 7px 9px;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 34%, transparent), 0 1px 2px rgba(0,0,0,.3);
}
[data-variant="bloque"] .ev .t { font-size: 13px; letter-spacing: -.005em; display: block; }
[data-variant="bloque"] .ev .m { display: block; margin-top: 1px; }
[data-variant="bloque"] .ev .k { display: none; }
[data-variant="bloque"] .ev[data-busy] {
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px);
  box-shadow: inset 0 0 0 1px var(--border);
}
[data-variant="bloque"] .ev[data-busy] .t { color: var(--fg-dim); font-weight: 500; }
[data-variant="bloque"] .slot:hover { background: rgba(255,255,255,.018); }

/* ═══════════════════════════════════════════════════════════════════════
   VARIANTE 3 · FLUJO — la metáfora: el tiempo como cinta
   Sin tabla. El alto ES la duración. El hueco libre es "disponible".
   ═══════════════════════════════════════════════════════════════════════ */
[data-variant="flujo"] .heads, [data-variant="flujo"] .days { grid-template-columns: 46px repeat(5, 1fr); }
[data-variant="flujo"] .colhead { padding: 14px 0 16px; }
[data-variant="flujo"] .hourline { border-top: 0; }
[data-variant="flujo"] .col { border-right: 0; padding: 0 5px; }
[data-variant="flujo"] .rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.05); }
[data-variant="flujo"] .free {
  position: absolute; left: 5px; right: 5px;
  background: radial-gradient(120% 80% at 50% 50%, rgba(255,255,255,.022), transparent 70%);
  border-radius: 14px;
}
[data-variant="flujo"] .ev {
  left: 0; right: 0;
  background: color-mix(in srgb, var(--c) 26%, #0c0c0e);
  border-radius: 999px; padding: 9px 13px;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 4px 14px rgba(0,0,0,.35);
}
[data-variant="flujo"] .ev .t { font-size: 13px; display: block; }
[data-variant="flujo"] .ev .m { display: block; margin-top: 1px; font-size: 11px; }
[data-variant="flujo"] .ev .k { display: none; }
[data-variant="flujo"] .ev[data-compact] { padding: 7px 13px; }
[data-variant="flujo"] .ev[data-compact] .m { display: none; }
[data-variant="flujo"] .ev[data-busy] { background: rgba(255,255,255,.045); box-shadow: 0 0 0 1px var(--border); }
[data-variant="flujo"] .hourlab { right: auto; left: 4px; background: var(--bg); padding: 0 4px; font-size: 10.5px; }
[data-variant="flujo"] .inlinetime {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 6;
  font-size: 10.5px; font-weight: 500; color: var(--fg-faint);
  background: var(--bg); padding: 1px 6px; border-radius: 999px; pointer-events: none;
  font-variant-numeric: tabular-nums;
}

.slot { position: absolute; left: 0; right: 0; cursor: crosshair; }

/* ═══ Selector de variantes (verbatim de PICKER.md: es chrome, no diseño) ═══ */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Preciso</button>
  <button class="proto-picker-item">Bloque</button>
  <button class="proto-picker-item">Flujo</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Datos realistas: las categorías y las verticales del grupo
   ══════════════════════════════════════════════════════════════════════ */
const CATS = {
  trabajo:    { label: "Trabajo",    color: "#ff5a5a" },
  ministerial:{ label: "Ministerial",color: "#4da3ff" },
  personal:   { label: "Personal",   color: "#34d399" },
  consultora: { label: "Consultora", color: "#fe4100" },
  software:   { label: "Software",   color: "#8b5cf6" },
};
const DAYS = ["Lun 15", "Mar 16", "Mié 17", "Jue 18", "Vie 19"];
const START_H = 8, END_H = 21, SLOTS_PER_H = 4;

let EVENTS = [
  { day: 0, min: 8 * 60 + 30, dur: 45,  title: "Reunión de equipo",            cat: "trabajo",     origin: "CRM",     sync: "ok" },
  { day: 0, min: 10 * 60,      dur: 60,  title: "Constructora Del Sur S.A.",  cat: "consultora",  origin: "CRM",     sync: "ok",   sub: "Diagnóstico 360°" },
  { day: 0, min: 14 * 60 + 15, dur: 45,  title: "Revisión de propuesta",      cat: "software",    origin: "CRM",     sync: "pend", sub: "Cabral, Franco" },
  { day: 0, min: 16 * 60,      dur: 90,  title: "Ocupado",                    cat: null,          origin: "Google",  sync: null,   busy: true },
  { day: 1, min: 9 * 60,       dur: 30,  title: "Llamada: Oscar Vera",        cat: "consultora",  origin: "Reserva", sync: "ok",   sub: "Reservó por la web" },
  { day: 1, min: 11 * 60 + 30, dur: 60,  title: "Ministerial · Cuerpo de Cristo", cat: "ministerial", origin: "CRM", sync: "ok" },
  { day: 1, min: 15 * 60,      dur: 120, title: "Block: trabajo profundo",    cat: "personal",    origin: "CRM",     sync: "ok" },
  { day: 2, min: 8 * 60,       dur: 60,  title: "Cuerpo de Cristo",           cat: "ministerial", origin: "Google",  sync: null,   busy: true },
  { day: 2, min: 12 * 60 + 30, dur: 45,  title: "Almuerzo con Marcos",        cat: "personal",    origin: "Google",  sync: null,   busy: true },
  { day: 2, min: 17 * 60,      dur: 60,  title: "Jonatan · Plan 3",           cat: "consultora",  origin: "Reserva", sync: "fail", sub: "Reintentando sincronizar" },
  { day: 3, min: 10 * 60,      dur: 30,  title: "Seguimiento semanal",        cat: "trabajo",     origin: "CRM",     sync: "ok" },
  { day: 3, min: 13 * 60 + 15, dur: 90,  title: "Taller: Software y Apps",    cat: "software",    origin: "CRM",     sync: "ok" },
  { day: 4, min: 9 * 60 + 30,  dur: 45,  title: "Fernando Bustos · Plan 1",   cat: "consultora",  origin: "Reserva", sync: "ok" },
  { day: 4, min: 12 * 60,      dur: 60,  title: "Ministerio · Los 1000 Socios",cat: "ministerial",origin: "CRM",     sync: "ok" },
  { day: 4, min: 16 * 60 + 30, dur: 60,  title: "Legendarios · próximas fechas", cat: "ministerial", origin: "Google", sync: null, busy: true },
];

const fmt = (min) => String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
const snap = (min) => Math.round(min / 15) * 15;
const cat = (k) => CATS[k] || { label: "", color: "#6b7280" };

/* ══════════════════════════════════════════════════════════════════════
   Grilla + interacción (idéntica en las tres; cambia la presentación)
   ══════════════════════════════════════════════════════════════════════ */
const HOUR_H = { preciso: 44, bloque: 52, flujo: 58 };
let VARIANT = "preciso";

function geom() {
  const hourH = HOUR_H[VARIANT];
  return {
    hourH,
    gridH: (END_H - START_H) * hourH,
    yOf: (min) => ((min - START_H * 60) / 60) * hourH,
    minOf: (y) => START_H * 60 + (y / hourH) * 60,
  };
}

const overlaps = (cand) => EVENTS.some((e) =>
  e.day === cand.day && !e.busy && e !== cand &&
  cand.min < e.min + e.dur && e.min < cand.min + cand.dur);

function renderEvent(e, g) {
  const c = cat(e.cat);
  const top = g.yOf(e.min), h = Math.max((e.dur / 60) * g.hourH - 2, 22);
  const compact = h < 46;
  const sync = e.sync ? `<span class="sync ${e.sync}" title="Sincronización"></span>` : "";
  return `<button class="ev" data-i="${EVENTS.indexOf(e)}" data-compact
    style="top:${top}px;height:${h}px;--c:${c.color}" ${e.busy ? "data-busy" : ""}>
    <span class="k"></span>
    <span class="t">${e.title}${sync}</span>
    <span class="m">${fmt(e.min)} – ${fmt(e.min + e.dur)}${e.origin === "Reserva" ? " · web" : ""}</span>
    ${e.busy ? "" : '<span class="grip" title="Estirar para cambiar la duración"></span>'}
  </button>`;
}

function renderCol(day, g) {
  const evs = EVENTS.filter((e) => e.day === day);
  const lines = [];
  for (let h = START_H; h <= END_H; h++) {
    lines.push(`<div class="hourline" style="top:${g.yOf(h * 60)}px"></div>`);
    if (h < END_H) lines.push(`<div class="hourline half" style="top:${g.yOf(h * 60 + 30)}px"></div>`);
  }
  // huecos libres (solo en Flujo, donde el vacío es información)
  const free = [];
  if (VARIANT === "flujo") {
    let cursor = START_H * 60;
    for (const e of evs.slice().sort((a, b) => a.min - b.min)) {
      if (e.min - cursor > 30) free.push(`<div class="free" style="top:${g.yOf(cursor)}px;height:${((e.min - cursor) / 60) * g.hourH - 4}px"></div>`);
      cursor = Math.max(cursor, e.min + e.dur);
    }
    if (END_H * 60 - cursor > 30) free.push(`<div class="free" style="top:${g.yOf(cursor)}px;height:${((END_H * 60 - cursor) / 60) * g.hourH - 4}px"></div>`);
  }
  return `<div class="col" data-day="${day}" style="height:${g.gridH}px">
    ${VARIANT === "flujo" ? '<div class="rail"></div>' : ""}
    ${free.join("")}${lines.join("")}
    <div class="slots"></div>
    ${evs.map((e) => renderEvent(e, g)).join("")}
  </div>`;
}

function render() {
  const g = geom();
  const total = EVENTS.filter((e) => !e.busy).length;
  const now = 15 * 60 + 42;
  const gutter = `<div class="gutter" style="height:${g.gridH}px">${
    Array.from({ length: END_H - START_H + 1 }, (_, i) => {
      const h = START_H + i;
      return `<span class="hourlab" style="top:${g.yOf(h * 60)}px;transform:translateY(-50%)">${fmt(h * 60)}</span>`;
    }).join("")}</div>`;

  return `<div class="shell" data-variant="${VARIANT}">
    <aside class="side">
      <div>
        <p class="block-title">Agendas</p>
        ${Object.entries(CATS).map(([k, v], i) => `<div class="cal" ${i > 2 ? "data-off" : ""}>
          <span class="dot" style="background:${v.color}"></span>
          <span class="name">${v.label}</span>
          <span class="count">${EVENTS.filter((e) => e.cat === k).length}</span>
        </div>`).join("")}
      </div>
      <div>
        <p class="block-title">Origen</p>
        ${["CRM", "Reserva web", "Google"].map((o) => `<div class="cal">
          <span class="dot" style="background:var(--fg-faint)"></span><span class="name">${o}</span>
          <span class="count">${EVENTS.filter((e) => (e.origin || "").startsWith(o.split(" ")[0])).length}</span>
        </div>`).join("")}
      </div>
      <div>
        <p class="block-title">Buscador</p>
        <input class="btn" style="width:100%;text-align:left;color:var(--fg-faint)" value="Buscar…  ⌘K" readonly>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <span class="rangetitle">15 – 19 de septiembre</span>
        <span class="rangecount">${total} reuniones · 3 sin sincronizar</span>
        <span class="right">
          <div class="seg"><button class="on">Semana</button><button>Día</button><button>Mes</button></div>
          <button class="btn">Hoy</button>
          <button class="btn primary">Nueva reunión</button>
        </span>
      </div>
      <div class="gridwrap">
        <div class="heads">
          ${VARIANT === "flujo" ? '<div class="colhead"></div>' : '<div class="colhead"></div>'}
          ${DAYS.map((d, i) => `<div class="colhead${i === 1 ? " today" : ""}">
            <span class="dow">${d.split(" ")[0]}</span><span class="dom">${d.split(" ")[1]}</span></div>`).join("")}
        </div>
        <div class="days">
          ${gutter}
          ${DAYS.map((_, i) => renderCol(i, g)).join("")}
        </div>
      </div>
    </main>

    <aside class="mini">
      <div>
        <p class="block-title">Septiembre</p>
        <div class="mgrid">
          ${["L", "M", "M", "J", "V", "S", "D"].map((x) => `<span class="h">${x}</span>`).join("")}
          ${Array.from({ length: 35 }, (_, i) => {
            const d = i - 0;
            const isRange = d >= 15 && d <= 19, isToday = d === 16, hasEv = d >= 15 && d <= 19 && d % 2 === 0;
            return `<span class="${isRange ? "inrange " : ""}${isToday ? "today " : ""}${hasEv ? "ev" : ""}">${d < 1 || d > 30 ? "" : d}</span>`;
          }).join("")}
        </div>
      </div>
      <div>
        <p class="block-title">Cómo se lee</p>
        <div class="legend">
          ${Object.entries(CATS).slice(0, 3).map(([, v]) => `<div><i style="background:${v.color}"></i>${v.label}</div>`).join("")}
          <div><i style="background:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 4px,transparent 4px 8px)"></i>Ocupado (de Google)</div>
        </div>
      </div>
    </aside>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   Interacción: crear arrastrando · mover · estirar · snap 15 (1:1, springs)
   ══════════════════════════════════════════════════════════════════════ */
let drag = null, lab = null;

function ensureLab() {
  if (!lab) { lab = document.createElement("div"); lab.className = "droplab"; document.body.appendChild(lab); }
  return lab;
}

function onDown(ev) {
  const col = ev.target.closest(".col");
  if (!col) return;
  const g = geom();
  const day = Number(col.dataset.day);
  const y = ev.clientY - col.getBoundingClientRect().top;
  const el = ev.target.closest(".ev");

  if (el && el.hasAttribute("data-busy")) return;

  if (el) {
    const e = EVENTS[Number(el.dataset.i)];
    const resizing = !!ev.target.closest(".grip");
    drag = { kind: resizing ? "resize" : "move", e, day, y0: y, min0: e.min, dur0: e.dur, moved: false };
    el.style.zIndex = 20;
    el.style.boxShadow = "0 10px 30px rgba(0,0,0,.5), 0 0 0 1px var(--border-2)";
  } else {
    const start = snap(g.minOf(y));
    drag = { kind: "create", day, min0: start, dur0: 15, y0: y, moved: false };
  }
  ev.preventDefault();
}

function onMove(ev) {
  if (!drag) return;
  const g = geom();
  const days = document.querySelectorAll(".col");
  drag.moved = true;

  if (drag.kind === "create") {
    const day = drag.day;
    const y = ev.clientY - days[day].getBoundingClientRect().top;
    const cur = snap(g.minOf(y));
    const min = Math.min(drag.min0, cur);
    const dur = Math.max(15, Math.abs(cur - drag.min0) + (cur > drag.min0 ? 0 : 15));
    paintGhost(day, min, dur, g);
    showLab(ev, `${fmt(min)} – ${fmt(min + dur)}`, false);
  } else {
    const e = drag.e;
    if (drag.kind === "resize") {
      const y = ev.clientY - days[e.day].getBoundingClientRect().top;
      e.dur = Math.max(15, snap(g.minOf(y)) - e.min);
      showLab(ev, `${fmt(e.min)} – ${fmt(e.min + e.dur)}`, overlaps(e));
      paint();
    } else {
      const day = drag.day;
      const y = ev.clientY - days[day].getBoundingClientRect().top;
      const delta = snap(g.minOf(y)) - snap(g.minOf(drag.y0));
      e.min = Math.max(START_H * 60, Math.min(END_H * 60 - e.dur, drag.min0 + delta));
      e.day = day;
      showLab(ev, `${fmt(e.min)} – ${fmt(e.min + e.dur)}`, overlaps(e));
      paint();
    }
  }
}

function paintGhost(day, min, dur, g) {
  let gh = document.getElementById("ghost");
  if (!gh) {
    gh = document.createElement("div");
    gh.id = "ghost"; gh.className = "ev";
    gh.style.pointerEvents = "none"; gh.style.opacity = ".8"; gh.style.zIndex = 15;
  }
  const col = document.querySelector(`.col[data-day="${day}"]`);
  if (gh.parentElement !== col) col.appendChild(gh);
  gh.style.top = g.yOf(min) + "px";
  gh.style.height = Math.max((dur / 60) * g.hourH - 2, 22) + "px";
  gh.style.background = "color-mix(in srgb, var(--accent) 20%, #141417)";
  gh.style.borderRadius = VARIANT === "flujo" ? "999px" : "9px";
  gh.style.boxShadow = "inset 0 0 0 1px var(--accent-line)";
  gh.innerHTML = `<span class="t">${fmt(min)} – ${fmt(min + dur)}</span><span class="m">Nueva reunión</span>`;
}

function showLab(ev, text, clash) {
  const l = ensureLab();
  l.style.left = ev.clientX + "px";
  l.style.top = ev.clientY + "px";
  l.innerHTML = `<b>${text}</b>${clash ? " · <em>se superpone</em>" : ""}`;
  l.style.display = "block";
}

function onUp() {
  if (!drag) return;
  const d = drag; drag = null;
  if (lab) lab.style.display = "none";
  document.getElementById("ghost")?.remove();

  if (d.moved && d.kind === "create") {
    EVENTS.push({ day: d.day, min: d.min0, dur: d.dur || 30, title: "Nueva reunión", cat: "trabajo", origin: "CRM", sync: "pend" });
  }
  paint();
}

function paint() {
  const stage = document.getElementById("stage");
  const obj = stage.querySelector("[data-variant]");
  if (!obj) return;
  const v = VARIANT; stage.innerHTML = render();
  VARIANT = v;
  // el now line se redibuja y los listeners se re-enganchan
  document.querySelectorAll(".col").forEach((c) => {
    if (!c.querySelector(".slots")) return;
  });
  needle();
}

function needle() {
  document.querySelector(".nowline")?.remove();
  document.querySelectorAll(".inlinetime").forEach((n) => n.remove());
  const g = geom();
  const now = 15 * 60 + 42;
  const line = document.createElement("div");
  line.className = "nowline";
  line.style.top = g.yOf(now) + "px";
  line.innerHTML = '<div class="knob"></div><div class="bar"></div>';
  document.querySelector('.col[data-day="1"]')?.appendChild(line);
}

/* ══════════════════════════════════════════════════════════════════════
   Picker (verbatim del spec)
   ══════════════════════════════════════════════════════════════════════ */
const VARIANTS = ["preciso", "bloque", "flujo"];
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  VARIANT = VARIANTS[i];
  stage.innerHTML = "";
  requestAnimationFrame(() => { stage.innerHTML = render(); needle(); });
}
function setActive(i) {
  if (i < 0 || i >= VARIANTS.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);
window.addEventListener("pointerdown", onDown, true);
window.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= VARIANTS.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % VARIANTS.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + VARIANTS.length) % VARIANTS.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
