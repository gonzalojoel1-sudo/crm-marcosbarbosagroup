<style>:root{--bg: #08080a;--surface: #101014;--surface-2: #16161c;--border: #23232b;--border-2: #2e2e38;--fg: #f5f5f7;--fg-dim: #9a9aa6;--fg-faint: #5f5f6b;--accent: #7c5cff;--accent-2: #a78bfa;--danger: #fb7185;--ok: #34d399;--r: 12px}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.app{min-height:100vh;position:relative;overflow-x:hidden}.glow{position:fixed;top:-280px;left:50%;transform:translate(-50%);width:900px;height:500px;background:radial-gradient(circle at center,rgba(124,92,255,.16),transparent 62%);filter:blur(20px);pointer-events:none;z-index:0}.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:48px 20px 80px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}.head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}.date{margin:4px 0 0;color:var(--fg-dim);font-size:14px}.pill{font-size:12.5px;font-weight:600;color:var(--accent-2);background:#7c5cff1f;border:1px solid rgba(124,92,255,.25);padding:5px 12px;border-radius:999px;white-space:nowrap}.pill.zero{color:var(--ok);background:#34d3991a;border-color:#34d39940}.quick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0 14px;transition:border-color .15s ease,box-shadow .15s ease}.quick:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px #7c5cff24}.quick svg{color:var(--fg-faint);flex:none}.quick input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:15px;padding:14px 0;min-width:0}.quick input::placeholder{color:var(--fg-faint)}kbd{font-family:inherit;font-size:11px;font-weight:600;color:var(--fg-faint);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;flex:none}section{margin-top:32px}h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim)}.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:0}.badge.danger{color:var(--danger);background:#fb71851f}.list{list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}.task,.event{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;transition:background .12s ease}.task{cursor:pointer;-webkit-user-select:none;user-select:none}.task:hover,.event:hover{background:var(--surface-2)}.task .subject,.event .subject{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task .when,.event .when{color:var(--fg-faint);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}.event .when{min-width:44px}.task .check{width:18px;height:18px;border:1.5px solid var(--border-2);border-radius:6px;flex:none;transition:border-color .15s ease,background .15s ease}.task:hover .check{border-color:var(--accent)}.task.overdue .subject{color:var(--danger)}.task.leaving{animation:leave .22s ease forwards}@keyframes leave{to{opacity:0;transform:translate(8px)}}.empty{display:flex;align-items:center;gap:10px;padding:18px 16px;color:var(--fg-dim);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:14px}.empty-ico{color:var(--fg-faint);flex:none}.error{margin-top:20px;padding:12px 14px;border-radius:var(--r);background:#fb71851a;border:1px solid rgba(251,113,133,.25);color:var(--danger);font-size:13.5px}.skeleton{margin-top:32px;display:flex;flex-direction:column;gap:10px}.sk{height:46px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-200% 0}}.foot{margin-top:40px;text-align:center}.kbd-hint{font-size:12px;color:var(--fg-faint)}.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:11px 20px;background:#08080ad1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.brand{font-weight:700;letter-spacing:-.01em;font-size:14px}.tabs{display:flex;gap:2px}.tabs button{background:transparent;border:none;color:var(--fg-dim);font:inherit;font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--surface-2);color:var(--fg)}.tabs button:hover{color:var(--fg)}.ag{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:20px 20px 60px}.ag-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.ag-range{font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:-.01em}.ag-actions{display:flex;align-items:center;gap:10px}.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px}.seg button{background:transparent;border:none;color:var(--fg-dim);font:inherit;font-size:12.5px;font-weight:500;padding:4px 11px;border-radius:6px;cursor:pointer}.seg button.on{background:var(--surface-2);color:var(--fg)}.ghost{background:var(--surface);border:1px solid var(--border);color:var(--fg-dim);font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:9px;cursor:pointer}.ghost:hover{color:var(--fg);border-color:var(--border-2)}.pager{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px}.pager button{background:transparent;border:none;color:var(--fg-dim);font-size:15px;width:26px;height:26px;border-radius:6px;cursor:pointer}.pager button:hover{background:var(--surface-2);color:var(--fg)}.ag-grid{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.ag-grid.one{grid-template-columns:58px 1fr}.ag-grid.loading{opacity:.65}.ag-gutter{position:relative;border-right:1px solid var(--border)}.ag-hourlabel{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--fg-faint);font-variant-numeric:tabular-nums}.ag-col{position:relative;border-right:1px solid var(--border);min-width:0}.ag-col:last-child{border-right:none}.ag-dayhead{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:9px 0;border-bottom:1px solid var(--border)}.ag-dayhead .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-faint)}.ag-dayhead .dom{font-size:15px;font-weight:600}.ag-dayhead.today{background:#7c5cff14}.ag-dayhead.today .dom{color:var(--accent-2)}.ag-body{position:relative}.ag-line{position:absolute;left:0;right:0;height:1px;background:var(--border);opacity:.55}.ag-slots{position:absolute;top:0;right:0;bottom:0;left:0}.ag-slot{position:absolute;left:0;right:0;cursor:pointer}.ag-slot:hover{background:#7c5cff0f}.ag-event{position:absolute;left:3px;right:3px;background:#7c5cff29;border-left:2px solid var(--accent);border-radius:6px;padding:3px 7px;overflow:hidden;z-index:2}.ag-event .ev-time{font-size:10.5px;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums}.ag-event .ev-title{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ag-task{position:absolute;left:3px;right:3px;display:flex;align-items:center;gap:5px;transform:translateY(-50%);font-size:11.5px;color:var(--fg-dim);z-index:3}.ag-task .dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex:none}.ag-task .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ag-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4}.ag-now:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}@media (max-width: 820px){.ag-grid:not(.one){grid-template-columns:44px repeat(7,minmax(0,1fr))}.ag-event .ev-title{display:none}.wrap{padding-top:28px}}
