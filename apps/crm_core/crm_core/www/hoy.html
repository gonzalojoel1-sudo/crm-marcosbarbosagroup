dius:6px;padding:2px 6px;flex:none}section{margin-top:32px}h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim)}.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:0}.badge.danger{color:var(--danger);background:#fb71851f}.list{list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}.task,.event{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;transition:background .12s ease}.task{cursor:pointer;-webkit-user-select:none;user-select:none}.task:hover,.event:hover{background:var(--surface-2)}.task .subject,.event .subject{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task .when,.event .when{color:var(--fg-faint);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}.event .when{min-width:44px}.task .check{width:18px;height:18px;border:1.5px solid var(--border-2);border-radius:6px;flex:none;transition:border-color .15s ease,background .15s ease}.task:hover .check{border-color:var(--accent)}.task.overdue .subject{color:var(--danger)}.task.leaving{animation:leave .22s ease forwards}@keyframes leave{to{opacity:0;transform:translate(8px)}}.empty{display:flex;align-items:center;gap:10px;padding:18px 16px;color:var(--fg-dim);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:14px}.empty-ico{color:var(--fg-faint);flex:none}.error{margin-top:20px;padding:12px 14px;border-radius:var(--r);background:#fb71851a;border:1px solid rgba(251,113,133,.25);color:var(--danger);font-size:13.5px}.skeleton{margin-top:32px;display:flex;flex-direction:column;gap:10px}.sk{height:46px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-200% 0}}.foot{margin-top:40px;text-align:center}.kbd-hint{font-size:12px;color:var(--fg-faint)}
