[project]
name = "crm_core"
version = "0.0.1"
description = "Premium CRM core (custom app: 9 DocTypes + Google Calendar 2-way sync + Cal.com bridge)"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "requests>=2.32.0",
]

[tool.setuptools.packages.find]
include = ["crm_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
